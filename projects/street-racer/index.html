<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Racer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05080f;font-family:Poppins,system-ui,sans-serif;color:#fff}
  .hud{position:fixed;pointer-events:none;font-weight:600;text-shadow:0 1px 6px #000c}
  #tl{top:16px;left:16px;font-size:16px;line-height:1.5;letter-spacing:1px}
  #tl b{color:#61a8d8;font-size:30px}
  #dash{right:24px;bottom:20px;text-align:right}
  #kmh{font-size:72px;line-height:1}
  #dash small{display:block;font-size:13px;opacity:.75;letter-spacing:3px}
  #gear{font-size:34px;color:#61a8d8}
  #rpm{width:260px;height:8px;background:#ffffff22;border-radius:4px;margin:8px 0 0 auto;overflow:hidden}
  #rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#61a8d8 70%,#ff3b30)}
  #lights{top:18%;left:50%;transform:translateX(-50%);display:flex;gap:14px;padding:14px 18px;background:#111c;border-radius:12px;opacity:0;transition:opacity .3s}
  #lights i{width:44px;height:44px;border-radius:50%;background:#2a0d0d;box-shadow:inset 0 0 8px #000}
  #lights i.on{background:#ff2a1a;box-shadow:0 0 24px #ff2a1a,0 0 60px #ff2a1a88}
  #go{top:30%;left:0;right:0;text-align:center;font-size:96px;color:#61a8d8;opacity:0;transition:opacity .4s}
  #map{position:fixed;top:16px;right:16px;width:180px;height:180px;background:#05080fbb;border:1px solid #ffffff22;border-radius:10px}
  #screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#0b1620cc,#000e);text-align:center;padding:16px}
  #screen h1{font-size:56px;margin:0 0 8px;letter-spacing:3px}
  #screen h1 em{color:#61a8d8;font-style:normal}
  #screen p{max-width:480px;line-height:1.6;opacity:.9}
  #screen button{margin-top:16px;padding:12px 36px;font:600 18px Poppins,system-ui;background:#61a8d8;color:#fff;border:0;border-radius:6px;cursor:pointer}
  #loading{opacity:.7}
  kbd{background:#fff2;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div id="tl" class="hud">POS <b id="pos">-</b>/6<br>LAP <b id="lap">1</b>/3<br><span id="ltime">0.00</span> · best <span id="best">-</span></div>
<div id="dash" class="hud"><span id="gear">N</span><div id="kmh">0</div><small>KM/H</small><div id="rpm"><i></i></div></div>
<div id="lights" class="hud"><i></i><i></i><i></i><i></i><i></i></div>
<div id="go" class="hud">GO</div>
<canvas id="map" width="360" height="360"></canvas>
<div id="screen">
  <h1>STREET <em>RACER</em></h1>
  <p>Night race at the stadium. Three laps, five rivals, all Huracáns. Throw it sideways with the handbrake for drift smoke.</p>
  <p><kbd>W</kbd>/<kbd>↑</kbd> throttle · <kbd>S</kbd>/<kbd>↓</kbd> brake · <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> steer · <kbd>Space</kbd> handbrake · <kbd>C</kbd> camera</p>
  <p id="loading">Loading cars…</p>
  <button id="start" style="display:none">Race</button>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- Renderer, night look, bloom ----------
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.95;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05080f);
scene.fog=new THREE.FogExp2(0x070c18,.0011);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,2500);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.45,.96);
composer.addPass(bloom); composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x8fa6d6,0x0b0d10,.55));
const key=new THREE.DirectionalLight(0xf3f6ff,2.4); // stadium floods
key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.bias=-.0004;
Object.assign(key.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:300});
scene.add(key,key.target);

// stars
{ const g=new THREE.BufferGeometry(), p=[];
  for(let i=0;i<2500;i++){ const v=new THREE.Vector3().randomDirection(); if(v.y<.05) v.y=-v.y+.05; v.multiplyScalar(1800); p.push(v.x,v.y,v.z); }
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xaabbdd,size:1.6,sizeAttenuation:false,fog:false}))); }

const std=(c,r=.85,m=0,extra={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,...extra});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),std(0x16301a,1));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// ---------- Circuit ----------
const ROAD_W=16, RUNOFF=9, WALL=ROAD_W/2+RUNOFF, N=1200;
const ctrl=[[0,0],[260,0],[380,0],[430,40],[420,110],[340,130],[300,180],[330,250],[300,320],[200,330],[120,270],
  [60,300],[-40,340],[-140,300],[-170,200],[-120,140],[-180,80],[-150,10],[-80,0]].map(([x,z])=>new THREE.Vector3(x-130,0,z-170));
const curve=new THREE.CatmullRomCurve3(ctrl,true,'centripetal',.5);
const P=curve.getSpacedPoints(N).slice(0,N);
const T=P.map((p,i)=>P[(i+1)%N].clone().sub(P[(i-1+N)%N]).normalize());
const S=T.map(t=>new THREE.Vector3(-t.z,0,t.x));
const SEG=curve.getLength()/N;
const curv=T.map((t,i)=>Math.acos(THREE.MathUtils.clamp(t.dot(T[(i+14)%N]),-1,1)));

function strip(o0,o1,y,mat,{stripe=false,uScale=0,vert=null}={}){
  const pos=[],uv=[],col=[],idx=[];
  for(let i=0;i<=N;i++){ const k=i%N;
    if(vert){ const a=P[k].clone().addScaledVector(S[k],o0); pos.push(a.x,vert[0],a.z,a.x,vert[1],a.z); }
    else{ const a=P[k].clone().addScaledVector(S[k],o0), b=P[k].clone().addScaledVector(S[k],o1); pos.push(a.x,y,a.z,b.x,y,b.z); }
    uv.push(i*SEG*uScale,0,i*SEG*uScale,1);
    if(stripe){ const c=(i>>1)%2?[.8,.05,.05]:[.95,.95,.95]; col.push(...c,...c); }
    if(i<N) idx.push(i*2,i*2+1,i*2+2,i*2+1,i*2+3,i*2+2);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  if(stripe) g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.receiveShadow=true; scene.add(m); return m;
}
// asphalt with procedural grain
function noiseTex(base,amt,size=256){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'), d=x.createImageData(size,size);
  for(let i=0;i<size*size;i++){ const n=base+(Math.random()-.5)*amt; d.data.set([n,n,n*1.03,255],i*4); }
  x.putImageData(d,0,0); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}
const asphaltTex=noiseTex(58,26); asphaltTex.repeat.set(1,1);
strip(-ROAD_W/2,ROAD_W/2,.02,std(0xffffff,.55,.05,{map:asphaltTex,envMapIntensity:.35}),{uScale:.08});
const kerbMat=std(0xffffff,.5,0,{vertexColors:true});
strip(ROAD_W/2,ROAD_W/2+1.4,.04,kerbMat,{stripe:true}); strip(-ROAD_W/2-1.4,-ROAD_W/2,.04,kerbMat,{stripe:true});
const lineMat=new THREE.MeshBasicMaterial({color:0xdddddd});
strip(ROAD_W/2-.6,ROAD_W/2-.35,.03,lineMat); strip(-ROAD_W/2+.35,-ROAD_W/2+.6,.03,lineMat);
const gravel=std(0x8a7a5c,1,0,{map:noiseTex(150,60)});
strip(ROAD_W/2+1.4,WALL,.015,gravel,{uScale:.1}); strip(-WALL,-ROAD_W/2-1.4,.015,gravel,{uScale:.1});

// sponsor walls (emissive boards → bloom)
function boardTex(){
  const c=document.createElement('canvas'); c.width=1024; c.height=96; const x=c.getContext('2d');
  x.fillStyle='#0a1320'; x.fillRect(0,0,1024,96);
  const items=['10X VISUALS','HURACÁN','10X VISUALS','NIGHT GP'];
  x.font='bold 54px Poppins, Arial, sans-serif'; x.textBaseline='middle';
  items.forEach((s,i)=>{ x.fillStyle=i%2?'#ffffff':'#61a8d8'; x.fillText(s,20+i*256,50,236); });
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
const bt=boardTex();
const wallMat=std(0xffffff,.6,0,{map:bt,emissive:0xffffff,emissiveMap:bt,emissiveIntensity:.9,side:THREE.DoubleSide});
strip(WALL,0,0,wallMat,{vert:[0,1.3],uScale:1/24}); strip(-WALL,0,0,wallMat,{vert:[0,1.3],uScale:1/24});
const concrete=std(0x9a9ea6,.9);
strip(WALL+.01,0,0,concrete,{vert:[1.3,1.6]}); strip(-WALL-.01,0,0,concrete,{vert:[1.3,1.6]});
// catch-fence: thin dark lines on posts
const fenceMat=new THREE.MeshBasicMaterial({color:0x223040,transparent:true,opacity:.35,side:THREE.DoubleSide});
strip(WALL+.3,0,0,fenceMat,{vert:[1.6,5]}); strip(-WALL-.3,0,0,fenceMat,{vert:[1.6,5]});

// start/finish chequer + gantry with lights
for(let r=0;r<3;r++) for(let c=0;c<ROAD_W;c++){
  const q=new THREE.Mesh(new THREE.PlaneGeometry(1,1),std((r+c)%2?0x111111:0xcccccc,.6));
  const p=P[0].clone().addScaledVector(S[0],-ROAD_W/2+.5+c).addScaledVector(T[0],r-1.5);
  q.rotation.set(-Math.PI/2,0,Math.atan2(T[0].x,T[0].z)); q.position.set(p.x,.05,p.z); scene.add(q);
}
const gantry=new THREE.Group();
for(const s of[-1,1]){ const post=new THREE.Mesh(new THREE.BoxGeometry(.8,9,.8),std(0x1b2230,.4,.6)); post.position.set(s*(WALL-.5),4.5,0); gantry.add(post); }
const beam=new THREE.Mesh(new THREE.BoxGeometry(WALL*2,2,1),std(0x101622,.4,.5,{emissive:0x61a8d8,emissiveIntensity:.25})); beam.position.y=9; gantry.add(beam);
const startLights=[];
for(let i=0;i<5;i++){ const l=new THREE.Mesh(new THREE.CircleGeometry(.45,24),new THREE.MeshBasicMaterial({color:0x220606}));
  l.position.set(-2.4+i*1.2,9,.52); gantry.add(l); startLights.push(l); }
gantry.position.copy(P[0]); gantry.rotation.y=Math.atan2(T[0].x,T[0].z)+Math.PI; scene.add(gantry);

// ---------- Floodlight towers ----------
const towerMat=std(0x30363f,.5,.7), headMat=new THREE.MeshBasicMaterial({color:0xfff8e8});
for(let i=0;i<N;i+=55){ const side=(i/55)%2?1:-1;
  const p=P[i].clone().addScaledVector(S[i],side*(WALL+14));
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.9,34,8),towerMat); t.position.set(p.x,17,p.z); t.castShadow=true; scene.add(t);
  const h=new THREE.Group(); h.position.set(p.x,35,p.z); h.lookAt(P[i].x,0,P[i].z);
  for(let a=0;a<3;a++) for(let b=0;b<4;b++){ const l=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.8),headMat); l.position.set(-1.8+b*1.2,-.9+a*.9,.1); h.add(l); }
  const back=new THREE.Mesh(new THREE.BoxGeometry(5.2,3.1,.3),towerMat); back.position.z=-.1; h.add(back); scene.add(h);
}

// ---------- Grandstands with crowd ----------
const standMat=std(0x2b3340,.8), roofMat=std(0x1a1f28,.5,.6);
const crowdGeo=new THREE.BoxGeometry(.5,1.1,.4), crowdMat=std(0xffffff,.8);
const crowdSpots=[];
function grandstand(i0,i1,side){
  for(let i=i0;i<i1;i+=3){ const k=(i+N)%N, ang=Math.atan2(S[k].x,S[k].z)*1;
    for(let row=0;row<10;row++){
      const off=side*(WALL+5+row*1.6), p=P[k].clone().addScaledVector(S[k],off);
      const step=new THREE.Mesh(new THREE.BoxGeometry(SEG*3+.2,.6+row*1.1,1.6),standMat);
      step.position.set(p.x,(.6+row*1.1)/2,p.z); step.rotation.y=ang+Math.PI/2; step.receiveShadow=true; scene.add(step);
      for(let s=0;s<Math.round(SEG*3/.8);s++) if(Math.random()<.85)
        crowdSpots.push({p:p.clone().addScaledVector(T[k],-SEG*1.5+.4+s*.8+rnd(-.1,.1)).setY(.6+row*1.1+.55),rot:ang,ph:Math.random()*6});
    }
    const rp=P[k].clone().addScaledVector(S[k],side*(WALL+13));
    const roof=new THREE.Mesh(new THREE.BoxGeometry(SEG*3+.2,.4,20),roofMat); roof.position.set(rp.x,15.5,rp.z); roof.rotation.y=ang+Math.PI/2; scene.add(roof);
    if(i%12===0){ const strip_=new THREE.Mesh(new THREE.BoxGeometry(SEG*3,.15,.3),new THREE.MeshBasicMaterial({color:0x61a8d8}));
      const sp=P[k].clone().addScaledVector(S[k],side*(WALL+3.2)); strip_.position.set(sp.x,15.2,sp.z); strip_.rotation.y=ang+Math.PI/2; scene.add(strip_); }
  }
}
grandstand(-110,150,1); grandstand(560,700,-1); grandstand(900,990,1);
const crowd=new THREE.InstancedMesh(crowdGeo,crowdMat,crowdSpots.length);
const shirt=[0x61a8d8,0xffffff,0xd83a3a,0xf2c94c,0x222222,0x3aa86b,0xff8a1f];
const dummy=new THREE.Object3D();
crowdSpots.forEach((c,i)=>{ crowd.setColorAt(i,new THREE.Color(shirt[i%7]).multiplyScalar(rnd(.5,1))); });
scene.add(crowd);
function animateCrowd(t,excite){
  crowdSpots.forEach((c,i)=>{ dummy.position.copy(c.p); dummy.position.y+=Math.max(0,Math.sin(t*6+c.ph))*.25*excite; dummy.rotation.y=c.rot; dummy.updateMatrix(); crowd.setMatrixAt(i,dummy.matrix); });
  crowd.instanceMatrix.needsUpdate=true;
}

// pit building on main straight (inside)
{ const k=60, p=P[k].clone().addScaledVector(S[k],-(WALL+12)), ang=Math.atan2(S[k].x,S[k].z);
  const b=new THREE.Mesh(new THREE.BoxGeometry(160,10,14),std(0x232a35,.6,.3)); b.position.set(p.x,5,p.z); b.rotation.y=ang+Math.PI/2; scene.add(b);
  const g=new THREE.Mesh(new THREE.BoxGeometry(160,2.4,.2),new THREE.MeshBasicMaterial({color:0x9fd3f5})); g.position.set(0,2,7.1); b.add(g);
  const sign=new THREE.Mesh(new THREE.BoxGeometry(60,2.2,.2),new THREE.MeshBasicMaterial({color:0x61a8d8})); sign.position.set(0,8.6,7.1); b.add(sign); }

// ---------- Track queries ----------
function nearest(p,hint,win){ let best=hint,bd=1e9;
  for(let k=-win;k<=win;k++){ const i=(hint+k+N)%N, d=(P[i].x-p.x)**2+(P[i].z-p.z)**2; if(d<bd){bd=d;best=i;} } return best; }
function lateral(p,i){ return (p.x-P[i].x)*S[i].x+(p.z-P[i].z)*S[i].z; }

// ---------- Cars ----------
const loader=new GLTFLoader();
const carG=await loader.loadAsync('huracan.glb');
const PAINTS=[0xff6a00,0x61a8d8,0xd81e1e,0x18c06a,0xf2f2f2,0x111111];
function makeCar(color){
  const g=carG.scene.clone(true), wheels=[], paint=new THREE.MeshPhysicalMaterial({color,metalness:.55,roughness:.28,clearcoat:1,clearcoatRoughness:.04});
  g.traverse(o=>{
    if(o.isMesh){ o.castShadow=true; const n=o.material.name||'';
      if(/CarPaint_Max1/.test(n)&&!/Trim/.test(n)) o.material=paint;
      else if(/M_Light_Max1|Clear_Low1/.test(n)){ o.material=o.material.clone(); o.material.emissive=new THREE.Color(0xffffff); o.material.emissiveIntensity=2.5; }
      else if(/Red_SetHC/.test(n)){ o.material=o.material.clone(); o.material.emissive=new THREE.Color(0xff1a0a); o.material.emissiveIntensity=2.2; } }
    const m=/^wheel_([FR])([LR])/.exec(o.name); if(m){ o.rotation.order='YXZ'; wheels.push({o,front:m[1]==='F',left:m[2]==='L'}); }
  });
  scene.add(g); return {g,wheels};
}
const player={...makeCar(PAINTS[0]),player:true};
const rivals=PAINTS.slice(1).map((c,k)=>({...makeCar(c),skill:[.985,.965,.95,.93,.91][k]}));
const all=[player,...rivals];
// player headlights
const hlL=new THREE.SpotLight(0xfff4e0,60,70,.45,.5,1.4); hlL.position.set(0,.7,-2); hlL.target.position.set(0,0,-25);
player.g.add(hlL,hlL.target);

// ---------- Drift smoke + skid marks ----------
function softTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const gr=x.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gr; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }
const smokeTex=softTex(), smoke=[];
for(let i=0;i<260;i++){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0xd8dde6,transparent:true,opacity:0,depthWrite:false}));
  s.visible=false; scene.add(s); smoke.push({s,life:0,vel:new THREE.Vector3()}); }
let smokeI=0;
function puff(pos,base){ const p=smoke[smokeI++%smoke.length]; p.s.position.copy(pos); p.s.visible=true; p.life=1;
  p.vel.copy(base).multiplyScalar(.25).add(new THREE.Vector3(rnd(-1,1),rnd(.8,2),rnd(-1,1))); p.s.scale.setScalar(1.2); }
function updateSmoke(dt){ for(const p of smoke){ if(p.life<=0) continue; p.life-=dt*.55;
  p.s.position.addScaledVector(p.vel,dt); p.vel.multiplyScalar(Math.pow(.4,dt)); const k=1-p.life;
  p.s.scale.setScalar(1.2+k*7); p.s.material.opacity=Math.max(0,p.life)*.42; if(p.life<=0) p.s.visible=false; } }
const SKID_MAX=3000, skid=new THREE.InstancedMesh(new THREE.PlaneGeometry(.32,.6),new THREE.MeshBasicMaterial({color:0x050505,transparent:true,opacity:.55,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}),SKID_MAX);
skid.count=0; scene.add(skid); let skidI=0;
function skidMark(pos,heading){ dummy.position.set(pos.x,.03,pos.z); dummy.rotation.set(-Math.PI/2,0,heading); dummy.scale.set(1,1,1); dummy.updateMatrix();
  skid.setMatrixAt(skidI%SKID_MAX,dummy.matrix); skidI++; skid.count=Math.min(skidI,SKID_MAX); skid.instanceMatrix.needsUpdate=true; }

// ---------- Audio: real Huracán loops (local) with synth fallback ----------
let audio=null;
async function initAudio(){
  const ac=new (window.AudioContext||window.webkitAudioContext)(), out=ac.createGain(); out.gain.value=.6; out.connect(ac.destination);
  const comp=ac.createDynamicsCompressor(); comp.connect(out);
  const layer=async(url,fallbackHz)=>{
    const g=ac.createGain(); g.gain.value=0; g.connect(comp);
    try{ const buf=await ac.decodeAudioData(await (await fetch(url)).arrayBuffer());
      const s=ac.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(g); s.start(); return {g,rate:v=>s.playbackRate.setTargetAtTime(v,ac.currentTime,.03)};
    }catch{ // synth V10-ish: detuned saws through a lowpass
      const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.connect(g);
      const oscs=[1,2.01,.5].map(m=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=fallbackHz*m; o.connect(f); o.start(); return [o,m]; });
      return {g,rate:v=>oscs.forEach(([o,m])=>o.frequency.setTargetAtTime(fallbackHz*m*v,ac.currentTime,.03))};
    }
  };
  const low=await layer('audio/engine_low.wav',55), high=await layer('audio/engine_high.wav',95);
  // tyre screech: band-passed noise
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const ns=ac.createBufferSource(); ns.buffer=nb; ns.loop=true; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=4;
  const sg=ac.createGain(); sg.gain.value=0; ns.connect(bp).connect(sg).connect(comp); ns.start();
  audio={ac,low,high,sg};
}
function updateAudio(rpm,throttle,slip){
  if(!audio) return; const t=audio.ac.currentTime, x=(rpm-1000)/7500;
  audio.low.rate(.75+x*.9); audio.high.rate(.6+x*.65);
  audio.low.g.gain.setTargetAtTime((1-x)*(.55+.45*throttle),t,.05);
  audio.high.g.gain.setTargetAtTime(Math.min(1,x*1.3)*(.35+.65*throttle),t,.05);
  audio.sg.gain.setTargetAtTime(THREE.MathUtils.clamp((slip-3)/10,0,.35),t,.05);
}

// ---------- Physics ----------
const GEARS=[0,17,29,41,53,65,77,90]; // top speed (m/s) per gear
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code.startsWith('Arrow')||e.code==='Space') e.preventDefault(); if(e.code==='KeyC') camMode=(camMode+1)%3;});
addEventListener('keyup',e=>keys[e.code]=false);
let camMode=0;
const fwdV=new THREE.Vector3(), rightV=new THREE.Vector3();

function place(c,slot){
  const i=(N-8-slot*7)%N; c.idx=i; c.laps=-1; c.prog=0; c.finishAt=null;
  c.g.position.copy(P[i]).addScaledVector(S[i],slot%2?3.5:-3.5);
  c.heading=Math.atan2(-T[i].x,-T[i].z); c.g.rotation.set(0,c.heading,0);
  c.vel=new THREE.Vector3(); c.yawRate=0; c.steer=0; c.gear=1; c.rpm=1000; c.slip=0; c.speed=0; c.lane=slot%2?3.5:-3.5;
}
function progress(c){ const prev=c.idx, i=nearest(c.g.position,prev,50);
  if(prev>N*.9&&i<N*.1) c.laps++; else if(prev<N*.1&&i>N*.9) c.laps--; c.idx=i; c.prog=c.laps*N+i; }

function physics(c,dt,inp){
  fwdV.set(-Math.sin(c.heading),0,-Math.cos(c.heading)); rightV.set(-fwdV.z,0,fwdV.x);
  let vF=c.vel.dot(fwdV), vR=c.vel.dot(rightV);
  // gearbox
  const top=GEARS[c.gear];
  c.rpm=THREE.MathUtils.clamp(1000+7500*Math.abs(vF)/top,900,8600);
  if(c.rpm>7700&&c.gear<7){c.gear++; c.shift=.12;} else if(c.rpm<3000&&c.gear>1){c.gear--;}
  c.shift=Math.max(0,(c.shift||0)-dt);
  // longitudinal
  const torque=[0,15,13,11,9.5,8,6.8,5.6][c.gear];
  if(inp.throttle&&!c.shift) vF+=torque*inp.throttle*dt*(vF<0?3:1);
  if(inp.brake) vF-= (vF>1?26:9)*inp.brake*dt;
  vF-= (vF*.012*Math.abs(vF)+vF*.15)*dt; // drag + rolling
  if(vF<-14) vF=-14;
  // lateral grip (drift when handbrake or power-over at high slip)
  const offroad=Math.abs(lateral(c.g.position,c.idx))>ROAD_W/2+1.4;
  let grip=offroad?3.5:9;
  if(inp.handbrake) grip=1.1;
  else if(Math.abs(vR)>3.5&&inp.throttle) grip=2.4;
  vR*=Math.exp(-grip*dt);
  if(offroad) vF*=Math.pow(.55,dt);
  // yaw
  const sp=Math.abs(vF), steerMax=THREE.MathUtils.lerp(.62,.18,Math.min(1,sp/85));
  const target=inp.steer*steerMax*vF/2.7*(inp.handbrake?1.55:1);
  c.yawRate+=(target-c.yawRate)*Math.min(1,dt*(inp.handbrake?3:6));
  c.heading+=c.yawRate*dt;
  // rotate velocity with the car a bit less than the body → slide
  fwdV.set(-Math.sin(c.heading),0,-Math.cos(c.heading)); rightV.set(-fwdV.z,0,fwdV.x);
  c.vel.copy(fwdV).multiplyScalar(vF).addScaledVector(rightV,vR+(inp.handbrake?-c.yawRate*vF*.05:0));
  c.slip=Math.abs(vR); c.speed=vF;
  const next=c.g.position.clone().addScaledVector(c.vel,dt);
  // walls
  const i=nearest(next,c.idx,30), lat=lateral(next,i);
  if(Math.abs(lat)>WALL-1.2){ const s=Math.sign(lat); next.addScaledVector(S[i],-(Math.abs(lat)-(WALL-1.2))*s);
    const vn=c.vel.dot(S[i]); if(vn*s>0){ c.vel.addScaledVector(S[i],-vn*1.4); c.vel.multiplyScalar(.75); if(c.player) shake=.5; } }
  // car-car
  for(const o of all){ if(o===c) continue; const dx=next.x-o.g.position.x, dz=next.z-o.g.position.z, d=Math.hypot(dx,dz);
    if(d<2.4&&d>0){ next.x=o.g.position.x+dx/d*2.4; next.z=o.g.position.z+dz/d*2.4; c.vel.multiplyScalar(.985); if(c.player) shake=Math.max(shake,.2); } }
  c.g.position.copy(next);
  c.g.rotation.set(0,c.heading,0);
  c.g.rotateZ(THREE.MathUtils.clamp(c.yawRate*vF*.004,-.05,.05)); // body roll
  c.g.rotateX(THREE.MathUtils.clamp(-(inp.throttle-inp.brake)*.012,-.02,.02)); // pitch
  // wheels
  for(const w of c.wheels){ w.o.rotation.x-=vF*dt/.34; if(w.front) w.o.rotation.y=inp.steer*steerMax*.9; }
  // smoke + skids from rear wheels
  if(c.slip>4.5&&sp>6){ for(const w of c.wheels) if(!w.front){ const wp=w.o.getWorldPosition(new THREE.Vector3());
      if(Math.random()<Math.min(1,c.slip/10)) puff(wp.setY(.4),c.vel); skidMark(wp,c.heading); } }
  progress(c);
}

function aiInput(r){
  const look=(r.idx+30)%N, ahead=(r.idx+14)%N;
  const want=r.skill*THREE.MathUtils.clamp(92-curv[look]*95,26,92);
  const aim=P[ahead].clone().addScaledVector(S[ahead],r.lane*.6);
  let dh=Math.atan2(-(aim.x-r.g.position.x),-(aim.z-r.g.position.z))-r.heading; dh=Math.atan2(Math.sin(dh),Math.cos(dh));
  return {throttle:r.speed<want?1:0, brake:r.speed>want+4?.8:0, steer:THREE.MathUtils.clamp(dh*2.8,-1,1), handbrake:false};
}

// ---------- Minimap ----------
const mc=$('map').getContext('2d');
let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9; P.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mnz=Math.min(mnz,p.z);mxz=Math.max(mxz,p.z);});
const ms=300/Math.max(mxx-mnx,mxz-mnz), mx=p=>30+(p.x-mnx)*ms, mz=p=>30+(p.z-mnz)*ms;
const hex=c=>'#'+new THREE.Color(c).getHexString();
function drawMap(){ mc.clearRect(0,0,360,360); mc.lineWidth=9; mc.strokeStyle='#ffffff44'; mc.lineJoin='round'; mc.beginPath();
  P.forEach((p,i)=>i?mc.lineTo(mx(p),mz(p)):mc.moveTo(mx(p),mz(p))); mc.closePath(); mc.stroke();
  all.slice().reverse().forEach((c,k)=>{ const col=hex(PAINTS[all.indexOf(c)]); mc.fillStyle=col; mc.strokeStyle='#000'; mc.lineWidth=2;
    mc.beginPath(); mc.arc(mx(c.g.position),mz(c.g.position),c.player?11:7,0,7); mc.fill(); mc.stroke(); }); }

// ---------- Race state ----------
const fmt=t=>t.toFixed(2);
let best=(()=>{try{return +localStorage.getItem('racerBestLapGP')||0}catch{return 0}})();
$('best').textContent=best?fmt(best):'-';
let state='menu', clockT=0, raceTime=0, lapStart=0, shake=0, excite=.2, lastLap=1;
const LAPS=3;
function reset(){
  all.forEach((c,k)=>place(c,k===0?5:k-1)); skid.count=0; skidI=0;
  state='lights'; clockT=0; raceTime=0; lapStart=0; lastLap=1; excite=.6;
  $('screen').style.display='none'; $('lights').style.opacity=1; $('lights').querySelectorAll('i').forEach(l=>l.classList.remove('on'));
}
$('start').onclick=async()=>{ if(!audio) await initAudio(); else audio.ac.resume(); reset(); };
$('loading').style.display='none'; $('start').style.display='inline-block';
all.forEach((c,k)=>place(c,k===0?5:k-1));

function finish(){
  state='done'; excite=1;
  const order=[...all].sort((a,b)=>(a.finishAt??1e9)-(b.finishAt??1e9)||b.prog-a.prog), place_=order.indexOf(player)+1;
  setTimeout(()=>{ $('screen').querySelector('h1').innerHTML=place_===1?'YOU <em>WIN</em>':`P${place_}`;
    $('screen').querySelector('p').textContent=`Race time ${fmt(raceTime)}s · best lap ${best?fmt(best):'-'}s`;
    $('start').textContent='Race again'; $('screen').style.display='flex'; },2500);
}

// ---------- Loop ----------
const clock=new THREE.Clock(), camPos=new THREE.Vector3(), look=new THREE.Vector3();
camera.position.copy(player.g.position).add(new THREE.Vector3(30,20,30));
function tick(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(state==='lights'){
    clockT+=dt; const n=Math.min(5,Math.floor(clockT/.9));
    $('lights').querySelectorAll('i').forEach((l,i)=>l.classList.toggle('on',i<n)); startLights.forEach((l,i)=>l.material.color.set(i<n?0xff2010:0x220606));
    updateAudio(1000+(keys.KeyW||keys.ArrowUp?4500:0)+Math.random()*200,keys.KeyW?1:.2,0);
    if(clockT>4.5+Math.random()*.02){ state='race'; $('lights').style.opacity=0; startLights.forEach(l=>l.material.color.set(0x220606));
      $('go').style.opacity=1; setTimeout(()=>$('go').style.opacity=0,700); }
  }
  if(state==='race'||state==='done'){
    if(state==='race') raceTime+=dt;
    const inp=state==='race'?{throttle:(keys.KeyW||keys.ArrowUp)?1:0,brake:(keys.KeyS||keys.ArrowDown)?1:0,
      steer:((keys.KeyA||keys.ArrowLeft)?1:0)-((keys.KeyD||keys.ArrowRight)?1:0),handbrake:!!keys.Space}:{throttle:0,brake:.4,steer:0,handbrake:false};
    player.steer+=(inp.steer-player.steer)*Math.min(1,dt*7); inp.steer=player.steer;
    physics(player,dt,inp);
    rivals.forEach(r=>physics(r,dt,aiInput(r)));
    for(const c of all) if(!c.finishAt&&c.laps>=LAPS) c.finishAt=raceTime;
    const lap=Math.max(1,player.laps+1);
    if(player.laps===0&&lapStart===0) lapStart=raceTime;
    if(lap>lastLap){ const lt=raceTime-lapStart; lapStart=raceTime; lastLap=lap;
      if(lap>2&&(!best||lt<best)){ best=lt; try{localStorage.setItem('racerBestLapGP',best)}catch{} $('best').textContent=fmt(best); } }
    $('lap').textContent=Math.min(LAPS,lap); $('ltime').textContent=fmt(raceTime-lapStart);
    $('pos').textContent=[...all].sort((a,b)=>(a.finishAt??1e9)-(b.finishAt??1e9)||b.prog-a.prog).indexOf(player)+1;
    if(state==='race'&&player.laps>=LAPS) finish();
    updateAudio(player.rpm,inp.throttle,player.slip);
  }
  updateSmoke(dt);
  const kmh=Math.abs(Math.round(player.speed*3.6||0));
  $('kmh').textContent=kmh; $('gear').textContent=state==='race'||state==='done'?(player.speed<-.5?'R':player.gear):'N';
  $('rpm').firstElementChild.style.width=((player.rpm-900)/7700*100)+'%';
  if(Math.floor(t*10)%2===0) animateCrowd(t,excite);
  // camera
  const back=new THREE.Vector3(Math.sin(player.heading),0,Math.cos(player.heading));
  const sp=Math.max(0,player.speed);
  if(camMode===0){ camPos.copy(player.g.position).addScaledVector(back,7.2+sp*.03).add(new THREE.Vector3(0,2.3,0)); look.copy(player.g.position).setY(1.1); }
  else if(camMode===1){ camPos.copy(player.g.position).addScaledVector(back,-.4).setY(1.15); look.copy(player.g.position).addScaledVector(back,-20).setY(.9); }
  else { camPos.copy(player.g.position).addScaledVector(back,14).add(new THREE.Vector3(0,6,0)); look.copy(player.g.position).setY(1); }
  if(camMode===1) camera.position.copy(camPos); else camera.position.lerp(camPos,1-Math.pow(.0005,dt));
  shake=Math.max(0,shake-dt*1.5); const sh=shake+sp/90*.04;
  camera.position.add(new THREE.Vector3(rnd(-sh,sh),rnd(-sh,sh),rnd(-sh,sh)));
  camera.lookAt(look);
  camera.fov=60+sp/90*18; camera.updateProjectionMatrix();
  key.position.copy(player.g.position).add(new THREE.Vector3(40,80,25)); key.target.position.copy(player.g.position);
  drawMap();
  composer.render(); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
