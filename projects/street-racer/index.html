<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Racer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05080f;font-family:Poppins,system-ui,sans-serif;color:#fff}
  .hud{position:fixed;pointer-events:none;font-weight:600;text-shadow:0 1px 6px #000c}
  #tl{top:16px;left:16px;font-size:16px;line-height:1.5;letter-spacing:1px}
  #tl b{color:#61a8d8;font-size:30px}
  #dash{right:24px;bottom:20px;text-align:right}
  #kmh{font-size:72px;line-height:1}
  #dash small{display:block;font-size:13px;opacity:.75;letter-spacing:3px}
  #gear{font-size:34px;color:#61a8d8}
  #rpm{width:260px;height:8px;background:#ffffff22;border-radius:4px;margin:8px 0 0 auto;overflow:hidden}
  #rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#61a8d8 70%,#ff3b30)}
  #lights{top:18%;left:50%;transform:translateX(-50%);display:flex;gap:14px;padding:14px 18px;background:#111c;border-radius:12px;opacity:0;transition:opacity .3s}
  #lights i{width:44px;height:44px;border-radius:50%;background:#2a0d0d;box-shadow:inset 0 0 8px #000}
  #lights i.on{background:#ff2a1a;box-shadow:0 0 24px #ff2a1a,0 0 60px #ff2a1a88}
  #go{top:30%;left:0;right:0;text-align:center;font-size:96px;color:#61a8d8;opacity:0;transition:opacity .4s}
  #drift{top:14%;left:0;right:0;text-align:center;opacity:0;transition:opacity .25s}
  #drift b{display:block;font-size:54px;color:#ffb347}
  #drift span{font-size:20px;letter-spacing:2px}
  #map{position:fixed;top:16px;right:16px;width:180px;height:180px;background:#05080fbb;border:1px solid #ffffff22;border-radius:10px}
  #screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#0b1620cc,#000e);text-align:center;padding:16px}
  #screen h1{font-size:56px;margin:0 0 8px;letter-spacing:3px}
  #screen h1 em{color:#61a8d8;font-style:normal}
  #screen p{max-width:520px;line-height:1.6;opacity:.9}
  button{font:600 16px Poppins,system-ui;background:#61a8d8;color:#fff;border:0;border-radius:6px;cursor:pointer;padding:10px 24px}
  button.ghost{background:#ffffff14}
  #screen button{margin:6px}
  kbd{background:#fff2;padding:2px 6px;border-radius:4px}
  /* garage */
  #garage{position:fixed;inset:0;display:none;pointer-events:none}
  #garage .top{position:absolute;top:20px;left:24px;right:24px;display:flex;align-items:center;gap:16px;pointer-events:auto}
  #garage h2{margin:0;font-size:15px;letter-spacing:4px;opacity:.7}
  #carname{font-size:38px;font-weight:700;letter-spacing:1px}
  #garage .nav button{font-size:22px;padding:6px 16px}
  #panel{position:absolute;right:20px;top:90px;bottom:90px;width:320px;background:#070d18e6;border:1px solid #ffffff1a;border-radius:12px;padding:14px;overflow:auto;pointer-events:auto}
  #tabs{display:flex;gap:6px;margin-bottom:12px}
  #tabs button{flex:1;padding:8px 0;font-size:13px;background:#ffffff10}
  #tabs button.on{background:#61a8d8}
  .row{margin:10px 0}
  .row label{display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin-bottom:4px}
  .row input[type=range]{width:100%;accent-color:#61a8d8}
  .sw{display:flex;flex-wrap:wrap;gap:6px}
  .sw i{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid #ffffff30}
  .sw i.on{border-color:#fff;box-shadow:0 0 0 2px #61a8d8}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{padding:6px 10px;font-size:12px;background:#ffffff12}
  .chips button.on{background:#61a8d8}
  #stats{position:absolute;left:24px;bottom:24px;width:300px;pointer-events:none}
  #stats div{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;margin:6px 0}
  #stats div span{width:80px;opacity:.75}
  #stats div i{flex:1;height:6px;background:#ffffff1c;border-radius:3px;overflow:hidden}
  #stats div i b{display:block;height:100%;background:#61a8d8}
  #garage .bottom{position:absolute;right:20px;bottom:24px;display:flex;gap:10px;pointer-events:auto}
  #garage .bottom button{padding:12px 28px;font-size:17px}
  @media (max-width:760px){#panel{left:16px;right:16px;width:auto;top:auto;height:42%;bottom:80px}#stats{display:none}#carname{font-size:24px}}
</style>
</head>
<body>
<div id="tl" class="hud">POS <b id="pos">-</b>/6<br>LAP <b id="lap">1</b>/3<br><span id="ltime">0.00</span> · best <span id="best">-</span></div>
<div id="dash" class="hud"><span id="gear">N</span><div id="kmh">0</div><small>KM/H</small><div id="rpm"><i></i></div></div>
<div id="lights" class="hud"><i></i><i></i><i></i><i></i><i></i></div>
<div id="go" class="hud">GO</div>
<div id="drift" class="hud"><b id="dcombo">0</b><span id="dmult">x1</span></div>
<canvas id="map" width="360" height="360"></canvas>

<div id="garage">
  <div class="top"><div><h2>GARAGE</h2><div id="carname">-</div></div><div class="nav" style="margin-left:auto"><button id="prev" class="ghost">‹</button> <button id="next" class="ghost">›</button></div></div>
  <div id="stats"></div>
  <div id="panel">
    <div id="tabs"><button data-t="paint" class="on">Paint</button><button data-t="wheels">Wheels</button><button data-t="tune">Tune</button><button data-t="fx">FX</button></div>
    <div id="tab"></div>
  </div>
  <div class="bottom"><button id="goDrift" class="ghost">Drift mode</button><button id="goRace">Race</button></div>
</div>

<div id="screen">
  <h1>STREET <em>RACER</em></h1>
  <p id="msg">Night GP at the stadium. Pick a car in the garage, paint it, tune it, then race five rivals or chase a drift score.</p>
  <p><kbd>W</kbd>/<kbd>↑</kbd> throttle · <kbd>S</kbd>/<kbd>↓</kbd> brake/reverse · <kbd>A</kbd><kbd>D</kbd> steer · <kbd>Space</kbd> handbrake · <kbd>C</kbd> camera · <kbd>Esc</kbd> garage</p>
  <p id="loading">Loading…</p>
  <div><button id="toGarage" style="display:none">Enter garage</button></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=THREE.MathUtils.clamp;

// ---------- Renderer, night look, bloom ----------
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.95;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05080f);
scene.fog=new THREE.FogExp2(0x070c18,.0011);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,2500);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.45,.96);
composer.addPass(bloom); composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x8fa6d6,0x0b0d10,.55));
const key=new THREE.DirectionalLight(0xf3f6ff,2.4); // stadium floods
key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.bias=-.0004;
Object.assign(key.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:300});
scene.add(key,key.target);

// stars
{ const g=new THREE.BufferGeometry(), p=[];
  for(let i=0;i<2500;i++){ const v=new THREE.Vector3().randomDirection(); if(v.y<.05) v.y=-v.y+.05; v.multiplyScalar(1800); p.push(v.x,v.y,v.z); }
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xaabbdd,size:1.6,sizeAttenuation:false,fog:false}))); }

const std=(c,r=.85,m=0,extra={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,...extra});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),std(0x16301a,1));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// ---------- Circuit ----------
const ROAD_W=16, RUNOFF=9, WALL=ROAD_W/2+RUNOFF, N=1200;
const ctrl=[[0,0],[260,0],[380,0],[430,40],[420,110],[340,130],[300,180],[330,250],[300,320],[200,330],[120,270],
  [60,300],[-40,340],[-140,300],[-170,200],[-120,140],[-180,80],[-150,10],[-80,0]].map(([x,z])=>new THREE.Vector3(x-130,0,z-170));
const curve=new THREE.CatmullRomCurve3(ctrl,true,'centripetal',.5);
const P=curve.getSpacedPoints(N).slice(0,N);
const T=P.map((p,i)=>P[(i+1)%N].clone().sub(P[(i-1+N)%N]).normalize());
const S=T.map(t=>new THREE.Vector3(-t.z,0,t.x));
const SEG=curve.getLength()/N;
const curv=T.map((t,i)=>Math.acos(clamp(t.dot(T[(i+14)%N]),-1,1)));
// local turn radius + which side is the inside: offsets past the radius on the inside fold the ribbon over itself
// (the old "bugged map": walls and gravel crossing the road on tight corners)
const RAD=[], INSIDE=[];
for(let i=0;i<N;i++){ const a=T[(i-8+N)%N], b=T[(i+8)%N];
  const ang=Math.acos(clamp(a.dot(b),-1,1)); RAD.push(ang>1e-4?SEG*16/ang:1e9);
  INSIDE.push(Math.sign(b.clone().sub(a).dot(S[i]))||1); }
// smooth the radius so clamped edges don't zig-zag
for(let pass=0;pass<3;pass++) for(let i=0;i<N;i++) RAD[i]=Math.min(RAD[i],(RAD[(i+1)%N]+RAD[(i-1+N)%N])/2+2);
const offAt=(o,k)=>Math.sign(o)===INSIDE[k]?Math.sign(o)*Math.min(Math.abs(o),RAD[k]*.82):o;

function strip(o0,o1,y,mat,{stripe=false,uScale=0,vert=null}={}){
  const pos=[],uv=[],col=[],idx=[];
  for(let i=0;i<=N;i++){ const k=i%N;
    if(vert){ const a=P[k].clone().addScaledVector(S[k],offAt(o0,k)); pos.push(a.x,vert[0],a.z,a.x,vert[1],a.z); }
    else{ const a=P[k].clone().addScaledVector(S[k],offAt(o0,k)), b=P[k].clone().addScaledVector(S[k],offAt(o1,k)); pos.push(a.x,y,a.z,b.x,y,b.z); }
    uv.push(i*SEG*uScale,0,i*SEG*uScale,1);
    if(stripe){ const c=(i>>1)%2?[.8,.05,.05]:[.95,.95,.95]; col.push(...c,...c); }
    if(i<N) idx.push(i*2,i*2+1,i*2+2,i*2+1,i*2+3,i*2+2);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  if(stripe) g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.receiveShadow=true; scene.add(m); return m;
}
// anything built beside the track must stay clear of every other part of it
function clearOfTrack(p,d){ for(let i=0;i<N;i+=2){ if((P[i].x-p.x)**2+(P[i].z-p.z)**2<d*d) return false; } return true; }

function noiseTex(base,amt,size=256){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'), d=x.createImageData(size,size);
  for(let i=0;i<size*size;i++){ const n=base+(Math.random()-.5)*amt; d.data.set([n,n,n*1.03,255],i*4); }
  x.putImageData(d,0,0); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}
const asphaltTex=noiseTex(58,26);
strip(-ROAD_W/2,ROAD_W/2,.02,std(0xffffff,.55,.05,{map:asphaltTex,envMapIntensity:.35}),{uScale:.08});
const kerbMat=std(0xffffff,.5,0,{vertexColors:true});
strip(ROAD_W/2,ROAD_W/2+1.4,.04,kerbMat,{stripe:true}); strip(-ROAD_W/2-1.4,-ROAD_W/2,.04,kerbMat,{stripe:true});
const lineMat=new THREE.MeshBasicMaterial({color:0xdddddd});
strip(ROAD_W/2-.6,ROAD_W/2-.35,.03,lineMat); strip(-ROAD_W/2+.35,-ROAD_W/2+.6,.03,lineMat);
const gravel=std(0x8a7a5c,1,0,{map:noiseTex(150,60)});
strip(ROAD_W/2+1.4,WALL,.015,gravel,{uScale:.1}); strip(-WALL,-ROAD_W/2-1.4,.015,gravel,{uScale:.1});

function boardTex(){
  const c=document.createElement('canvas'); c.width=1024; c.height=96; const x=c.getContext('2d');
  x.fillStyle='#0a1320'; x.fillRect(0,0,1024,96);
  const items=['10X VISUALS','NIGHT GP','10X VISUALS','GARAGE'];
  x.font='bold 54px Poppins, Arial, sans-serif'; x.textBaseline='middle';
  items.forEach((s,i)=>{ x.fillStyle=i%2?'#ffffff':'#61a8d8'; x.fillText(s,20+i*256,50,236); });
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
const bt=boardTex();
const wallMat=std(0xffffff,.6,0,{map:bt,emissive:0xffffff,emissiveMap:bt,emissiveIntensity:.9,side:THREE.DoubleSide});
strip(WALL,0,0,wallMat,{vert:[0,1.3],uScale:1/24}); strip(-WALL,0,0,wallMat,{vert:[0,1.3],uScale:1/24});
const concrete=std(0x9a9ea6,.9);
strip(WALL+.01,0,0,concrete,{vert:[1.3,1.6]}); strip(-WALL-.01,0,0,concrete,{vert:[1.3,1.6]});
const fenceMat=new THREE.MeshBasicMaterial({color:0x223040,transparent:true,opacity:.35,side:THREE.DoubleSide});
strip(WALL+.3,0,0,fenceMat,{vert:[1.6,5]}); strip(-WALL-.3,0,0,fenceMat,{vert:[1.6,5]});

for(let r=0;r<3;r++) for(let c=0;c<ROAD_W;c++){
  const q=new THREE.Mesh(new THREE.PlaneGeometry(1,1),std((r+c)%2?0x111111:0xcccccc,.6));
  const p=P[0].clone().addScaledVector(S[0],-ROAD_W/2+.5+c).addScaledVector(T[0],r-1.5);
  q.rotation.set(-Math.PI/2,0,Math.atan2(T[0].x,T[0].z)); q.position.set(p.x,.05,p.z); scene.add(q);
}
const gantry=new THREE.Group();
for(const s of[-1,1]){ const post=new THREE.Mesh(new THREE.BoxGeometry(.8,9,.8),std(0x1b2230,.4,.6)); post.position.set(s*(WALL-.5),4.5,0); gantry.add(post); }
const beam=new THREE.Mesh(new THREE.BoxGeometry(WALL*2,2,1),std(0x101622,.4,.5,{emissive:0x61a8d8,emissiveIntensity:.25})); beam.position.y=9; gantry.add(beam);
const startLights=[];
for(let i=0;i<5;i++){ const l=new THREE.Mesh(new THREE.CircleGeometry(.45,24),new THREE.MeshBasicMaterial({color:0x220606}));
  l.position.set(-2.4+i*1.2,9,.52); gantry.add(l); startLights.push(l); }
gantry.position.copy(P[0]); gantry.rotation.y=Math.atan2(T[0].x,T[0].z)+Math.PI; scene.add(gantry);

// ---------- Floodlight towers ----------
const towerMat=std(0x30363f,.5,.7), headMat=new THREE.MeshBasicMaterial({color:0xfff8e8});
for(let i=0;i<N;i+=55){ const side=(i/55)%2?1:-1;
  const p=P[i].clone().addScaledVector(S[i],side*(WALL+14));
  if(!clearOfTrack(p,WALL+4)) continue;
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.9,34,8),towerMat); t.position.set(p.x,17,p.z); t.castShadow=true; scene.add(t);
  const h=new THREE.Group(); h.position.set(p.x,35,p.z); h.lookAt(P[i].x,0,P[i].z);
  for(let a=0;a<3;a++) for(let b=0;b<4;b++){ const l=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.8),headMat); l.position.set(-1.8+b*1.2,-.9+a*.9,.1); h.add(l); }
  const back=new THREE.Mesh(new THREE.BoxGeometry(5.2,3.1,.3),towerMat); back.position.z=-.1; h.add(back); scene.add(h);
}

// ---------- Grandstands with crowd ----------
const standMat=std(0x2b3340,.8), roofMat=std(0x1a1f28,.5,.6);
const crowdGeo=new THREE.BoxGeometry(.5,1.1,.4), crowdMat=std(0xffffff,.8);
const crowdSpots=[];
function grandstand(i0,i1,side){
  for(let i=i0;i<i1;i+=3){ const k=(i+N)%N, ang=Math.atan2(S[k].x,S[k].z);
    // whole stand section (front row to roof) must sit off every part of the track
    if(!clearOfTrack(P[k].clone().addScaledVector(S[k],side*(WALL+5)),WALL+3)||!clearOfTrack(P[k].clone().addScaledVector(S[k],side*(WALL+22)),WALL+3)) continue;
    for(let row=0;row<10;row++){
      const off=side*(WALL+5+row*1.6), p=P[k].clone().addScaledVector(S[k],off);
      const step=new THREE.Mesh(new THREE.BoxGeometry(SEG*3+.2,.6+row*1.1,1.6),standMat);
      step.position.set(p.x,(.6+row*1.1)/2,p.z); step.rotation.y=ang+Math.PI/2; step.receiveShadow=true; scene.add(step);
      for(let s=0;s<Math.round(SEG*3/.8);s++) if(Math.random()<.85)
        crowdSpots.push({p:p.clone().addScaledVector(T[k],-SEG*1.5+.4+s*.8+rnd(-.1,.1)).setY(.6+row*1.1+.55),rot:ang,ph:Math.random()*6});
    }
    const rp=P[k].clone().addScaledVector(S[k],side*(WALL+13));
    const roof=new THREE.Mesh(new THREE.BoxGeometry(SEG*3+.2,.4,20),roofMat); roof.position.set(rp.x,15.5,rp.z); roof.rotation.y=ang+Math.PI/2; scene.add(roof);
    if(i%12===0){ const strip_=new THREE.Mesh(new THREE.BoxGeometry(SEG*3,.15,.3),new THREE.MeshBasicMaterial({color:0x61a8d8}));
      const sp=P[k].clone().addScaledVector(S[k],side*(WALL+3.2)); strip_.position.set(sp.x,15.2,sp.z); strip_.rotation.y=ang+Math.PI/2; scene.add(strip_); }
  }
}
grandstand(-110,150,1); grandstand(560,700,-1); grandstand(900,990,1);
const crowd=new THREE.InstancedMesh(crowdGeo,crowdMat,Math.max(1,crowdSpots.length));
const shirt=[0x61a8d8,0xffffff,0xd83a3a,0xf2c94c,0x222222,0x3aa86b,0xff8a1f];
const dummy=new THREE.Object3D();
crowdSpots.forEach((c,i)=>{ crowd.setColorAt(i,new THREE.Color(shirt[i%7]).multiplyScalar(rnd(.5,1))); });
crowd.count=crowdSpots.length; scene.add(crowd);
function animateCrowd(t,excite){
  crowdSpots.forEach((c,i)=>{ dummy.position.copy(c.p); dummy.position.y+=Math.max(0,Math.sin(t*6+c.ph))*.25*excite; dummy.rotation.set(0,c.rot,0); dummy.scale.set(1,1,1); dummy.updateMatrix(); crowd.setMatrixAt(i,dummy.matrix); });
  crowd.instanceMatrix.needsUpdate=true;
}
{ const k=60, p=P[k].clone().addScaledVector(S[k],-(WALL+12)), ang=Math.atan2(S[k].x,S[k].z);
  if(clearOfTrack(p,WALL+8)){
  const b=new THREE.Mesh(new THREE.BoxGeometry(160,10,14),std(0x232a35,.6,.3)); b.position.set(p.x,5,p.z); b.rotation.y=ang+Math.PI/2; scene.add(b);
  const g=new THREE.Mesh(new THREE.BoxGeometry(160,2.4,.2),new THREE.MeshBasicMaterial({color:0x9fd3f5})); g.position.set(0,2,7.1); b.add(g);
  const sign=new THREE.Mesh(new THREE.BoxGeometry(60,2.2,.2),new THREE.MeshBasicMaterial({color:0x61a8d8})); sign.position.set(0,8.6,7.1); b.add(sign); } }

// ---------- Track queries ----------
function nearest(p,hint,win){ let best=hint,bd=1e9;
  for(let k=-win;k<=win;k++){ const i=(hint+k+N)%N, d=(P[i].x-p.x)**2+(P[i].z-p.z)**2; if(d<bd){bd=d;best=i;} } return best; }
function lateral(p,i){ return (p.x-P[i].x)*S[i].x+(p.z-P[i].z)*S[i].z; }

// ---------- Garage (showroom built off to the side of the circuit) ----------
const GAR=new THREE.Vector3(900,0,900);
const garage=new THREE.Group(); garage.position.copy(GAR); scene.add(garage);

// ---------- Audio: real engine loops (local) with synth fallback, backfire pops ----------
let audio=null;
async function initAudio(){
  const ac=new (window.AudioContext||window.webkitAudioContext)(), out=ac.createGain(); out.gain.value=.6; out.connect(ac.destination);
  const comp=ac.createDynamicsCompressor(); comp.connect(out);
  const layer=async(url,fallbackHz)=>{
    const g=ac.createGain(); g.gain.value=0; g.connect(comp);
    try{ const buf=await ac.decodeAudioData(await (await fetch(url)).arrayBuffer());
      const s=ac.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(g); s.start(); return {g,rate:v=>s.playbackRate.setTargetAtTime(v,ac.currentTime,.03)};
    }catch{
      const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.connect(g);
      const oscs=[1,2.01,.5].map(m=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=fallbackHz*m; o.connect(f); o.start(); return [o,m]; });
      return {g,rate:v=>oscs.forEach(([o,m])=>o.frequency.setTargetAtTime(fallbackHz*m*v,ac.currentTime,.03))};
    }
  };
  const low=await layer('audio/engine_low.wav',55), high=await layer('audio/engine_high.wav',95);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const ns=ac.createBufferSource(); ns.buffer=nb; ns.loop=true; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=4;
  const sg=ac.createGain(); sg.gain.value=0; ns.connect(bp).connect(sg).connect(comp); ns.start();
  audio={ac,low,high,sg,noise:nb,comp};
}
function pop(power){
  if(!audio) return; const {ac}=audio, t=ac.currentTime;
  for(let k=0;k<1+Math.floor(Math.random()*2);k++){ const s=ac.createBufferSource(); s.buffer=audio.noise; s.playbackRate.value=rnd(.6,1);
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=rnd(500,1100); const g=ac.createGain(); const t0=t+k*rnd(.04,.09);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(1.6*power,t0+.004); g.gain.exponentialRampToValueAtTime(.001,t0+.09);
    s.connect(f).connect(g).connect(audio.comp); s.start(t0,rnd(0,1.5),.12); }
}
function updateAudio(rpm,throttle,slip){
  if(!audio) return; const t=audio.ac.currentTime, x=(rpm-1000)/7500;
  audio.low.rate(.75+x*.9); audio.high.rate(.6+x*.65);
  audio.low.g.gain.setTargetAtTime((1-x)*(.55+.45*throttle),t,.05);
  audio.high.g.gain.setTargetAtTime(Math.min(1,x*1.3)*(.35+.65*throttle),t,.05);
  audio.sg.gain.setTargetAtTime(clamp((slip-3)/10,0,.35),t,.05);
}

// ---------- Physics ----------
// The velocity lives in world space. Each step the body yaws; the next step re-reads the same velocity in the new
// body frame, so any rotation shows up as sideways slip, and tyre grip then bleeds that slip off. Drift falls out of it.
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code.startsWith('Arrow')||e.code==='Space') e.preventDefault();
  if(e.code==='KeyC') camMode=(camMode+1)%3; if(e.code==='Escape'&&(state==='race'||state==='drift'||state==='lights'||state==='done')) openGarage(); });
addEventListener('keyup',e=>keys[e.code]=false);
let camMode=0;
const fwdV=new THREE.Vector3(), rightV=new THREE.Vector3();
const RATIOS=[0,.24,.38,.52,.66,.8,.92,1]; // fraction of top speed per gear

function place(c,slot,solo=false){
  const i=(N-8-slot*7)%N; c.idx=i; c.laps=-1; c.prog=0; c.finishAt=null;
  c.lane=solo?0:(slot%2?3.5:-3.5);
  c.g.position.copy(P[i]).addScaledVector(S[i],c.lane);
  c.heading=Math.atan2(-T[i].x,-T[i].z); c.g.rotation.set(0,c.heading,0);
  c.vel=new THREE.Vector3(); c.yawRate=0; c.steer=0; c.gear=1; c.rpm=1000; c.slip=0; c.speed=0; c.shift=0; c.lastThr=0; c.popT=0; c.angle=0;
}
function progress(c){ const prev=c.idx, i=nearest(c.g.position,prev,50);
  if(prev>N*.9&&i<N*.1) c.laps++; else if(prev<N*.1&&i>N*.9) c.laps--; c.idx=i; c.prog=c.laps*N+i; }

function physics(c,dt,inp){
  const s=c.setup, d=c.def;
  fwdV.set(-Math.sin(c.heading),0,-Math.cos(c.heading)); rightV.set(-fwdV.z,0,fwdV.x);
  let vF=c.vel.dot(fwdV), vR=c.vel.dot(rightV);
  const sp=Math.abs(vF), top=d.top*s.gearing*(.85+.15*s.power);
  // gearbox with hysteresis: upshift lands mid-band, downshift well below it
  const gTop=top*RATIOS[c.gear];
  c.rpm=clamp(1000+7400*sp/gTop,900,8700);
  if(c.rpm>7900&&c.gear<7&&vF>0){ c.gear++; c.shift=.14; if(inp.throttle) spitFlames(c,.8); }
  else if(c.gear>1&&sp<top*RATIOS[c.gear-1]*.62){ c.gear--; }
  c.shift=Math.max(0,c.shift-dt);
  // lift-off at high rpm → crackle and spit for a moment
  if(c.lastThr>.5&&!inp.throttle&&c.rpm>5200) c.popT=rnd(.35,.7);
  c.lastThr=inp.throttle;
  if(c.popT>0){ c.popT-=dt; if(Math.random()<dt*14) spitFlames(c,rnd(.5,1)); }
  // longitudinal
  const weight=s.weight, accel=d.accel*s.power/weight*(1.15-.55*(c.gear-1)/6);
  if(inp.throttle&&!c.shift&&vF>-1) vF+=accel*inp.throttle*dt*clamp(1-sp/top,0,1)**.35;
  if(inp.brake){ if(vF>.5) vF-=30*s.brakes/Math.sqrt(weight)*inp.brake*dt; else vF=Math.max(-12,vF-7*dt); } // hold S when stopped → reverse
  if(inp.throttle&&vF<-.5) vF+=20*dt;
  vF-=(vF*.0035*sp+vF*.08)*dt;
  // tyre grip
  const latDist=Math.abs(lateral(c.g.position,c.idx)), offroad=latDist>ROAD_W/2+1.4;
  const gripBase=11*d.grip*s.grip*(offroad?.45:1);
  const looseness=clamp(d.drift*.5+s.drift*.5,0,1);
  let grip=gripBase;
  if(inp.handbrake&&sp>3) grip=.9;
  else if(inp.throttle&&Math.abs(vR)>2&&sp>8) grip=gripBase*(.5-.4*looseness); // power-over keeps it sliding
  else if(Math.abs(vR)>4) grip=gripBase*(.7-.3*looseness);
  vR*=Math.exp(-grip*dt);
  if(offroad) vF*=Math.pow(.6,dt);
  // steering: real geometry, speed-sensitive lock, counter-steer assist while sliding
  const lock=.55*s.steer*THREE.MathUtils.lerp(1,.28,Math.min(1,sp/70));
  const slideAng=Math.atan2(vR,Math.max(sp,1));
  let target=vF*Math.tan(inp.steer*lock)/2.6;
  if(Math.abs(slideAng)>.12) target+=-slideAng*sp*.09*looseness*(inp.throttle?1:.5); // throttle holds the angle
  if(inp.handbrake) target*=1.5;
  c.yawRate+=(target-c.yawRate)*Math.min(1,dt*(Math.abs(slideAng)>.12?3.2:8));
  // assemble world velocity in the OLD frame, then yaw the body
  c.vel.copy(fwdV).multiplyScalar(vF).addScaledVector(rightV,vR);
  c.heading+=c.yawRate*dt;
  c.slip=Math.abs(vR); c.speed=vF; c.angle=Math.abs(slideAng);
  const next=c.g.position.clone().addScaledVector(c.vel,dt);
  // walls (follow the clamped wall line on tight corners)
  const i=nearest(next,c.idx,30), lat=lateral(next,i), sgn=Math.sign(lat)||1, wl=Math.abs(offAt(sgn*WALL,i))-1.2;
  c.hitWall=false;
  if(Math.abs(lat)>wl){ next.addScaledVector(S[i],-(Math.abs(lat)-wl)*sgn);
    const vn=c.vel.dot(S[i]); if(vn*sgn>0){ c.vel.addScaledVector(S[i],-vn*1.3); c.vel.multiplyScalar(.8); c.yawRate*=.5; c.hitWall=true; if(c.player) shake=.5; } }
  // car-car
  for(const o of all){ if(o===c) continue; const dx=next.x-o.g.position.x, dz=next.z-o.g.position.z, dd=Math.hypot(dx,dz);
    if(dd<2.4&&dd>0){ next.x=o.g.position.x+dx/dd*2.4; next.z=o.g.position.z+dz/dd*2.4; c.vel.multiplyScalar(.985); if(c.player) shake=Math.max(shake,.2); } }
  c.g.position.copy(next);
  c.g.rotation.set(0,c.heading,0);
  c.inner.rotation.set(clamp(-(inp.throttle-inp.brake)*.012,-.02,.02),0,clamp(-c.yawRate*vF*.004,-.05,.05)); // pitch + roll
  for(const w of c.wheels){ if(w.spin) w.o.rotation.x-=vF*dt/.34; if(w.front) w.o.rotation.y=inp.steer*lock*.9; }
  if(c.slip>4&&sp>6){ for(const w of c.wheels) if(!w.front){ const wp=w.o.getWorldPosition(new THREE.Vector3());
      if(Math.random()<Math.min(1,c.slip/10)) puff(wp.setY(.4),c.vel,c.setup.smoke); skidMark(wp,c.heading); } }
  progress(c);
}

function aiInput(r){
  const look=(r.idx+30)%N, ahead=(r.idx+14)%N;
  const want=r.skill*clamp(r.def.top-curv[look]*95,24,r.def.top);
  const aim=P[ahead].clone().addScaledVector(S[ahead],r.lane*.6);
  let dh=Math.atan2(-(aim.x-r.g.position.x),-(aim.z-r.g.position.z))-r.heading; dh=Math.atan2(Math.sin(dh),Math.cos(dh));
  return {throttle:r.speed<want?1:0, brake:r.speed>want+4?.8:0, steer:clamp(dh*2.6,-1,1), handbrake:false};
}

// ---------- Minimap ----------
const mc=$('map').getContext('2d');
let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9; P.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mnz=Math.min(mnz,p.z);mxz=Math.max(mxz,p.z);});
const msc=300/Math.max(mxx-mnx,mxz-mnz), ox=(360-(mxx-mnx)*msc)/2, oz=(360-(mxz-mnz)*msc)/2;
const mx=p=>ox+(p.x-mnx)*msc, mz=p=>oz+(p.z-mnz)*msc;
const hex=c=>'#'+new THREE.Color(c).getHexString();
function drawMap(){ mc.clearRect(0,0,360,360); mc.lineWidth=9; mc.strokeStyle='#ffffff44'; mc.lineJoin='round'; mc.beginPath();
  P.forEach((p,i)=>i?mc.lineTo(mx(p),mz(p)):mc.moveTo(mx(p),mz(p))); mc.closePath(); mc.stroke();
  [...all].reverse().forEach(c=>{ mc.fillStyle=hex(c.setup.paint); mc.strokeStyle=c.player?'#fff':'#000'; mc.lineWidth=c.player?3:2;
    mc.beginPath(); mc.arc(mx(c.g.position),mz(c.g.position),c.player?11:7,0,7); mc.fill(); mc.stroke(); }); }

// ---------- Game state ----------
const fmt=t=>t.toFixed(2);
let best=(()=>{try{return +localStorage.getItem('racerBestLapGP')||0}catch{return 0}})();
let bestDrift=(()=>{try{return +localStorage.getItem('racerBestDrift')||0}catch{return 0}})();
$('best').textContent=best?fmt(best):'-';
let state='menu', mode='race', clockT=0, raceTime=0, lapStart=0, shake=0, excite=.2, lastLap=1;
let driftScore=0, combo=0, mult=1, comboIdle=0;
const LAPS=3, DRIFT_TIME=90;
let player=null, rivals=[], all=[];
const headL=new THREE.SpotLight(0xfff4e0,60,70,.45,.5,1.4); headL.position.set(0,.7,-2); headL.target.position.set(0,0,-25);

function clearCars(){ for(const c of all) scene.remove(c.g); all=[]; rivals=[]; player=null; }
const RIVAL_PAINT=[0x61a8d8,0xd81e1e,0x18c06a,0xf2f2f2,0x111111,0xffd400,0x7b2ff7];

async function buildGrid(){
  clearCars();
  let def=avail.find(c=>c.id===save.car)||avail[0];
  try{ player=await makeCar(def,setupFor(def.id)); }catch{ def=avail[0]; save.car=def.id; player=await makeCar(def,setupFor(def.id)); } player.player=true; player.g.add(headL,headL.target);
  all=[player];
  if(mode==='race'){
    const pool=avail.filter(c=>c.id!==def.id).sort(()=>Math.random()-.5);
    while(pool.length<5) pool.push(avail[pool.length%avail.length]);
    const picks=pool.slice(0,5), fallback=avail.find(c=>c.id==='huracan')||def;
    rivals=await Promise.all(picks.map(async(d,k)=>{ const st={...defaultSetup(),paint:RIVAL_PAINT[k],finish:k%2?'metallic':'gloss',flames:true};
      const r=await makeCar(d,st).catch(()=>makeCar(fallback,st)); r.skill=[.985,.965,.95,.93,.91][k]; return r; }));
    all.push(...rivals);
  }
  all.forEach((c,k)=>place(c,c===player?(mode==='race'?5:0):k-1,mode!=='race'));
}

async function startMode(m){
  mode=m; $('garage').style.display='none'; garage.visible=false; $('loading').style.display='block'; $('loading').textContent='Loading cars…';
  $('screen').style.display='flex'; $('toGarage').style.display='none';
  if(!audio) await initAudio(); else audio.ac.resume();
  if(showCar){ scene.remove(showCar.g); showCar=null; }
  await buildGrid();
  skid.count=0; skidI=0; clockT=0; raceTime=0; lapStart=0; lastLap=1; excite=.6; driftScore=0; combo=0; mult=1;
  $('screen').style.display='none'; $('map').style.display='block';
  $('tl').innerHTML=mode==='race'?'POS <b id="pos">-</b>/6<br>LAP <b id="lap">1</b>/3<br><span id="ltime">0.00</span> · best <span id="best">-</span>'
    :'SCORE <b id="pos">0</b><br>TIME <b id="lap">90</b>s<br><span id="ltime"></span>best <span id="best">-</span>';
  if(mode==='race') $('best').textContent=best?fmt(best):'-';
  $('tl').style.display='block'; $('dash').style.display='block';
  if(mode==='race'){ state='lights'; $('lights').style.opacity=1; $('lights').querySelectorAll('i').forEach(l=>l.classList.remove('on')); }
  else { state='drift'; $('go').textContent='DRIFT'; $('go').style.opacity=1; setTimeout(()=>{$('go').style.opacity=0; $('go').textContent='GO';},900); }
}
function finish(){
  state='done'; excite=1;
  const order=[...all].sort((a,b)=>(a.finishAt??1e9)-(b.finishAt??1e9)||b.prog-a.prog), pl=order.indexOf(player)+1;
  setTimeout(()=>endScreen(pl===1?'YOU <em>WIN</em>':`P${pl}`,`Race time ${fmt(raceTime)}s · best lap ${best?fmt(best):'-'}s`),2500);
}
function finishDrift(){
  state='done'; bankCombo();
  if(driftScore>bestDrift){ bestDrift=driftScore; try{localStorage.setItem('racerBestDrift',bestDrift)}catch{} }
  setTimeout(()=>endScreen(`${Math.round(driftScore).toLocaleString()} <em>PTS</em>`,`Best drift score ${Math.round(bestDrift).toLocaleString()}`),1200);
}
function endScreen(h,p){ $('screen').querySelector('h1').innerHTML=h; $('msg').textContent=p; $('loading').style.display='none';
  $('toGarage').textContent='Back to garage'; $('toGarage').style.display='inline-block'; $('screen').style.display='flex'; }
function bankCombo(){ driftScore+=combo*mult; combo=0; mult=1; }

// ---------- Garage UI ----------
let showCar=null, gTab='paint', spin=0, showToken=0;
async function showInGarage(){
  const tok=++showToken, def=avail.find(c=>c.id===save.car)||avail[0];
  $('carname').textContent=def.name+' …';
  let c; try{ c=await makeCar(def,setupFor(def.id)); }catch{ if(tok===showToken){ save.car=avail[0].id; showInGarage(); } return; }
  if(tok!==showToken){ scene.remove(c.g); return; }
  if(showCar) scene.remove(showCar.g);
  showCar=c; c.g.position.copy(GAR).setY(.12); c.heading=0; $('carname').textContent=def.name; renderStats(); renderTab();
}
function openGarage(){
  state='garage'; clearCars(); garage.visible=true;
  $('screen').style.display='none'; $('garage').style.display='block'; $('map').style.display='none'; $('tl').style.display='none'; $('dash').style.display='none';
  $('lights').style.opacity=0; $('drift').style.opacity=0;
  showInGarage();
}
function cycle(d){ const i=avail.findIndex(c=>c.id===save.car); save.car=avail[(i+d+avail.length)%avail.length].id; persist(); showInGarage(); }
$('prev').onclick=()=>cycle(-1); $('next').onclick=()=>cycle(1);
$('goRace').onclick=()=>startMode('race'); $('goDrift').onclick=()=>startMode('drift');
$('toGarage').onclick=async()=>{ if(!audio) await initAudio(); openGarage(); };
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ gTab=b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); renderTab(); });

function renderStats(){ const def=showCar.def, s=showCar.setup;
  const bars=[['POWER',def.accel*s.power/s.weight/16],['TOP',def.top*s.gearing*(.85+.15*s.power)/110],['GRIP',def.grip*s.grip/1.5],['DRIFT',(def.drift+s.drift)/2],['BRAKES',s.brakes/1.6]];
  $('stats').innerHTML=bars.map(([n,v])=>`<div><span>${n}</span><i><b style="width:${clamp(v,0,1)*100}%"></b></i></div>`).join('')+
    `<div><span>EST TOP</span>${Math.round(def.top*s.gearing*(.85+.15*s.power)*3.6)} km/h</div>`; }
function changed(){ applySetup(showCar); persist(); renderStats(); }
function swatches(list,key){ return `<div class="sw">${list.map((c,i)=>`<i data-k="${key}" data-i="${i}" class="${showCar.setup[key]===c?'on':''}" style="background:${c==null?'repeating-linear-gradient(45deg,#333 0 4px,#555 4px 8px)':hex(c)}"></i>`).join('')}</div>`; }
const LISTS={paint:PAINT_SW,rim:RIM_SW,smoke:FX_SW,glow:GLOW_SW};
function slider(key,label,min,max,step,fmtV=v=>v.toFixed(2)){ const v=showCar.setup[key];
  return `<div class="row"><label>${label}<span id="v_${key}">${fmtV(v)}</span></label><input type="range" data-s="${key}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`; }
const FMT={ride:v=>`${Math.round(v*100)} mm`.replace('-',''),camber:v=>`${(v*57.3).toFixed(1)}°`,power:v=>`${Math.round(v*100)}%`,grip:v=>`${Math.round(v*100)}%`,
  drift:v=>`${Math.round(v*100)}%`,brakes:v=>`${Math.round(v*100)}%`,steer:v=>`${Math.round(v*100)}%`,gearing:v=>v<1?'short':v>1?'long':'stock',weight:v=>`${Math.round(1500*v)} kg`};
function renderTab(){
  const s=showCar.setup; let h='';
  if(gTab==='paint') h=`<div class="row"><label>Colour</label>${swatches(PAINT_SW,'paint')}</div>
    <div class="row"><label>Custom</label><input type="color" id="custom" value="${hex(s.paint)}"></div>
    <div class="row"><label>Finish</label><div class="chips">${Object.keys(FINISH).map(f=>`<button data-f="${f}" class="${s.finish===f?'on':''}">${f}</button>`).join('')}</div></div>`;
  if(gTab==='wheels') h=`<div class="row"><label>Rim colour</label>${swatches(RIM_SW,'rim')}</div>
    ${slider('ride','Ride height',-.08,.06,.005,FMT.ride)}${slider('camber','Camber',0,.12,.005,FMT.camber)}`;
  if(gTab==='tune') h=`${slider('power','Engine power',.7,1.6,.01,FMT.power)}${slider('gearing','Gearing',.85,1.2,.01,FMT.gearing)}
    ${slider('grip','Tyre grip',.7,1.4,.01,FMT.grip)}${slider('drift','Drift balance (rear looseness)',0,1,.01,FMT.drift)}
    ${slider('brakes','Brake force',.6,1.6,.01,FMT.brakes)}${slider('steer','Steering lock',.7,1.5,.01,FMT.steer)}${slider('weight','Weight',.8,1.25,.01,FMT.weight)}
    <div class="row"><button class="ghost" id="resetTune" style="width:100%">Reset tune</button></div>`;
  if(gTab==='fx') h=`<div class="row"><label>Tyre smoke</label>${swatches(FX_SW,'smoke')}</div>
    <div class="row"><label>Underglow</label>${swatches(GLOW_SW,'glow')}</div>
    <div class="row"><label>Exhaust flames</label><div class="chips"><button data-fl="1" class="${s.flames?'on':''}">On</button><button data-fl="0" class="${s.flames?'':'on'}">Off</button><button id="testFlame">Rev it</button></div></div>`;
  $('tab').innerHTML=h;
  $('tab').querySelectorAll('.sw i').forEach(el=>el.onclick=()=>{ s[el.dataset.k]=LISTS[el.dataset.k][+el.dataset.i]; changed(); renderTab(); });
  $('tab').querySelectorAll('input[type=range]').forEach(el=>el.oninput=()=>{ const k=el.dataset.s; s[k]=+el.value; $('v_'+k).textContent=(FMT[k]||(v=>v))(s[k]); changed(); });
  $('tab').querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{ s.finish=el.dataset.f; changed(); renderTab(); });
  $('tab').querySelectorAll('[data-fl]').forEach(el=>el.onclick=()=>{ s.flames=el.dataset.fl==='1'; changed(); renderTab(); });
  const cu=$('custom'); if(cu) cu.oninput=()=>{ s.paint=new THREE.Color(cu.value).getHex(); changed(); };
  const rt=$('resetTune'); if(rt) rt.onclick=()=>{ Object.assign(s,{power:1,grip:1,drift:.5,brakes:1,steer:1,gearing:1,weight:1}); changed(); renderTab(); };
  const tf=$('testFlame'); if(tf) tf.onclick=async()=>{ if(!audio) await initAudio(); revT=1.2; };
}
let revT=0;

// ---------- Loop ----------
const clock=new THREE.Clock(), camPos=new THREE.Vector3(), lookAt=new THREE.Vector3();
camera.position.set(GAR.x+8,3,GAR.z+8);
function tick(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(state==='garage'||state==='menu'){
    spin+=dt*.25;
    if(showCar){ showCar.g.rotation.y=spin; showCar.heading=spin; showCar.vel=new THREE.Vector3(); garage.userData.disc.rotation.y=spin;
      if(revT>0){ revT-=dt; const r=revT>.5?7500:1500; updateAudio(r,revT>.5?1:0,0); if(revT<.5&&revT+dt>=.5) for(let k=0;k<3;k++) setTimeout(()=>showCar&&spitFlames({...showCar,player:true}),k*110); }
      else updateAudio(1000,0,0); }
    const a=t*.12; camPos.set(GAR.x+Math.sin(a)*8.5,2.6,GAR.z+Math.cos(a)*8.5);
    camera.position.lerp(camPos,1-Math.pow(.02,dt)); camera.lookAt(GAR.x,.8,GAR.z); camera.fov=50; camera.updateProjectionMatrix();
    key.position.set(GAR.x+30,60,GAR.z+20); key.target.position.copy(GAR);
  }
  if(state==='lights'){
    clockT+=dt; const n=Math.min(5,Math.floor(clockT/.9));
    $('lights').querySelectorAll('i').forEach((l,i)=>l.classList.toggle('on',i<n)); startLights.forEach((l,i)=>l.material.color.set(i<n?0xff2010:0x220606));
    const rev=keys.KeyW||keys.ArrowUp; updateAudio(1000+(rev?5000:0)+Math.random()*200,rev?1:.2,0);
    if(player.lastThr&&!rev&&Math.random()<.5) spitFlames(player,.7); player.lastThr=rev?1:0;
    if(clockT>4.5){ state='race'; $('lights').style.opacity=0; startLights.forEach(l=>l.material.color.set(0x220606));
      $('go').style.opacity=1; setTimeout(()=>$('go').style.opacity=0,700); }
  }
  if(state==='race'||state==='drift'||state==='done'){
    const live=state!=='done';
    if(live) raceTime+=dt;
    const inp=live?{throttle:(keys.KeyW||keys.ArrowUp)?1:0,brake:(keys.KeyS||keys.ArrowDown)?1:0,
      steer:((keys.KeyA||keys.ArrowLeft)?1:0)-((keys.KeyD||keys.ArrowRight)?1:0),handbrake:!!keys.Space}:{throttle:0,brake:.4,steer:0,handbrake:false};
    player.steer+=(inp.steer-player.steer)*Math.min(1,dt*(inp.steer?6:9)); inp.steer=player.steer;
    physics(player,dt,inp);
    rivals.forEach(r=>physics(r,dt,aiInput(r)));
    if(mode==='race'){
      for(const c of all) if(!c.finishAt&&c.laps>=LAPS) c.finishAt=raceTime;
      const lap=Math.max(1,player.laps+1);
      if(player.laps===0&&lapStart===0) lapStart=raceTime;
      if(lap>lastLap){ const lt=raceTime-lapStart; lapStart=raceTime; lastLap=lap;
        if(lap>2&&(!best||lt<best)){ best=lt; try{localStorage.setItem('racerBestLapGP',best)}catch{} $('best').textContent=fmt(best); } }
      $('lap').textContent=Math.min(LAPS,lap); $('ltime').textContent=fmt(raceTime-lapStart);
      $('pos').textContent=[...all].sort((a,b)=>(a.finishAt??1e9)-(b.finishAt??1e9)||b.prog-a.prog).indexOf(player)+1;
      if(state==='race'&&player.laps>=LAPS) finish();
    } else {
      // drift scoring: angle × speed builds the combo, holding it raises the multiplier, a wall hit loses it
      const sp=Math.abs(player.speed);
      if(live&&player.angle>.2&&sp>9){ combo+=player.angle*sp*dt*12; comboIdle=0; mult=Math.min(5,mult+dt*.18); }
      else if(combo>0){ comboIdle+=dt; if(comboIdle>.9) bankCombo(); }
      if(player.hitWall&&combo>0){ combo=0; mult=1; }
      $('drift').style.opacity=combo>0?1:0; $('dcombo').textContent=Math.round(combo).toLocaleString(); $('dmult').textContent='x'+mult.toFixed(1);
      $('pos').textContent=Math.round(driftScore).toLocaleString(); $('lap').textContent=Math.max(0,Math.ceil(DRIFT_TIME-raceTime));
      $('best').textContent=Math.round(bestDrift).toLocaleString();
      if(live&&raceTime>=DRIFT_TIME) finishDrift();
    }
    updateAudio(player.rpm,inp.throttle,player.slip);
    const kmh=Math.abs(Math.round(player.speed*3.6||0));
    $('kmh').textContent=kmh; $('gear').textContent=player.speed<-.5?'R':player.gear;
    $('rpm').firstElementChild.style.width=((player.rpm-900)/7800*100)+'%';
  }
  if(state==='lights'){ $('kmh').textContent=0; $('gear').textContent='N'; }
  updateSmoke(dt); updateFlames(dt);
  if(Math.floor(t*10)%2===0) animateCrowd(t,excite);
  if(player&&state!=='garage'&&state!=='menu'){
    const back=new THREE.Vector3(Math.sin(player.heading),0,Math.cos(player.heading));
    const sp=Math.max(0,player.speed);
    if(camMode===0){ camPos.copy(player.g.position).addScaledVector(back,player.len*1.55+sp*.03).add(new THREE.Vector3(0,2.3,0)); lookAt.copy(player.g.position).setY(1.1); }
    else if(camMode===1){ camPos.copy(player.g.position).addScaledVector(back,-.2).setY(1.15+player.setup.ride); lookAt.copy(player.g.position).addScaledVector(back,-20).setY(.9); }
    else { camPos.copy(player.g.position).addScaledVector(back,14).add(new THREE.Vector3(0,6,0)); lookAt.copy(player.g.position).setY(1); }
    if(camMode===1) camera.position.copy(camPos); else camera.position.lerp(camPos,1-Math.pow(.0005,dt));
    shake=Math.max(0,shake-dt*1.5); const sh=shake+sp/90*.03;
    camera.position.add(new THREE.Vector3(rnd(-sh,sh),rnd(-sh,sh),rnd(-sh,sh)));
    camera.lookAt(lookAt);
    camera.fov=60+sp/90*18; camera.updateProjectionMatrix();
    key.position.copy(player.g.position).add(new THREE.Vector3(40,80,25)); key.target.position.copy(player.g.position);
    drawMap();
  }
  composer.render(); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

$('map').style.display='none'; $('tl').style.display='none'; $('dash').style.display='none';
$('loading').textContent=`${avail.length} cars in the garage`;
$('toGarage').style.display='inline-block';
// show the saved car spinning behind the title
showInGarage();
</script>
</body>
</html>
