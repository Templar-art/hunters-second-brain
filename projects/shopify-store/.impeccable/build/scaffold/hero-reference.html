<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-comp-a-flat-strap.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0c0c0c}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <figure class="r-logo region plate" data-region="logo"><img src="../../../assets/plates/logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-nav-menu region text" data-region="nav-menu"><!-- MENU link, wide-tracked caps --><p style="line-height:1.05;margin:0">nav-menu</p></div>
  <div class="r-nav-cart region text" data-region="nav-cart"><!-- CART (0) link, wide-tracked caps --><p style="line-height:1.05;margin:0">nav-cart</p></div>
  <div class="r-header-rule region chrome" data-region="header-rule"><!-- hairline white rule under the header --></div>
  <div class="r-headline region text" data-region="headline"><!-- BUILT TO THE LAST 1% heavy white caps, two lines --><p style="line-height:1.05;margin:0">headline</p></div>
  <div class="r-grid-texture region texture" data-region="grid-texture" style="background-image:url('../../../assets/plates/grid-texture.png');background-repeat:repeat"></div>
  <figure class="r-strap-plate region plate" data-region="strap-plate"><img src="../../../assets/plates/strap-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-callout-silicone region text" data-region="callout-silicone"><!-- SILICONE ANTI-SLIP GRIP callout label, mono caps --><p style="line-height:1.05;margin:0">callout-silicone</p></div>
  <div class="r-callout-neoprene region text" data-region="callout-neoprene"><!-- 5MM NEOPRENE PADDING callout label --><p style="line-height:1.05;margin:0">callout-neoprene</p></div>
  <div class="r-callout-dring region text" data-region="callout-dring"><!-- DOUBLE D-RING CUFF callout label --><p style="font-size:var(--r-callout-dring-font);line-height:1.05;margin:0">callout-dring</p></div>
  <div class="r-dimension-line region chrome" data-region="dimension-line"><!-- purple dimension line with arrowheads and end ticks spanning the strap --></div>
  <div class="r-dim-label region text" data-region="dim-label"><!-- 30CM large purple numerals --><p style="font-size:var(--r-dim-label-font);line-height:1.05;margin:0">dim-label</p></div>
  <div class="r-title-block region text" data-region="title-block"><!-- title block table: DWG 1P-LS-BLK, REV A, SCALE 1:1, PAIR in hairline-ruled cells --><p style="line-height:1.05;margin:0">title-block</p></div>
  <div class="r-price region text" data-region="price"><!-- $39.95 AUD white --><p style="line-height:1.05;margin:0">price</p></div>
  <div class="r-atc region control" data-region="atc"><!-- full-width flat purple ADD TO CART button, black caps: rebuild the control's chrome from the crop (comp-spec.mjs --crop atc); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
