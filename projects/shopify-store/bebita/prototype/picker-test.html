<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picker test</title>
<style>@font-face{font-family:'Parkinsans';font-weight:800;src:url('../theme/assets/bebita-parkinsans-800.woff2') format('woff2')}@font-face{font-family:'Public Sans';font-weight:100 900;src:url('../theme/assets/bebita-publicsans-var.woff2') format('woff2')}</style>
<link rel="stylesheet" href="../theme/assets/bebita.css"></head><body><section class="bb bb-picker" id="picker" aria-labelledby="bb-picker-title-t" data-bb-picker
  data-money-format="${{amount}}" data-cart-url="/cart" data-cart-add="/cart/add.js">
  <div class="bb-picker__head">
    <h2 id="bb-picker-title-t" class="bb-h2">Build it<br>here.</h2>
    <div class="bb-switch bb-switch--picker" role="radiogroup" aria-label="Line">
      <button type="button" role="radio" aria-checked="true" data-bb-pick-line="active">Active</button>
      <button type="button" role="radio" aria-checked="false" data-bb-pick-line="swim">Swim</button>
    </div>
  </div>

  <div class="bb-picker__slots">
    
      <fieldset class="bb-slot" data-bb-slot="top">
        <legend class="bb-slot__legend">Top</legend>
        <div class="bb-slot__media"><img alt="" width="720" height="900" data-bb-slot-img hidden></div>
        <div class="bb-slot__controls">
          <div class="bb-slot__group" data-bb-group="style"><span class="bb-slot__label">Style</span><div class="bb-chips" data-bb-chips="style"></div></div>
          <div class="bb-slot__group" data-bb-group="colour"><span class="bb-slot__label">Colour <em data-bb-value="colour"></em></span><div class="bb-chips bb-chips--swatch" data-bb-chips="colour"></div></div>
          <div class="bb-slot__group" data-bb-group="size"><span class="bb-slot__label">Size</span><div class="bb-chips" data-bb-chips="size"></div></div>
          <p class="bb-slot__stock" data-bb-stock aria-live="polite"></p>
        </div>
        <p class="bb-slot__empty" data-bb-empty hidden>Pieces are being added now. Check back soon.</p>
      </fieldset><fieldset class="bb-slot" data-bb-slot="bottom">
        <legend class="bb-slot__legend">Bottom</legend>
        <div class="bb-slot__media"><img alt="" width="720" height="900" data-bb-slot-img hidden></div>
        <div class="bb-slot__controls">
          <div class="bb-slot__group" data-bb-group="style"><span class="bb-slot__label">Style</span><div class="bb-chips" data-bb-chips="style"></div></div>
          <div class="bb-slot__group" data-bb-group="colour"><span class="bb-slot__label">Colour <em data-bb-value="colour"></em></span><div class="bb-chips bb-chips--swatch" data-bb-chips="colour"></div></div>
          <div class="bb-slot__group" data-bb-group="size"><span class="bb-slot__label">Size</span><div class="bb-chips" data-bb-chips="size"></div></div>
          <p class="bb-slot__stock" data-bb-stock aria-live="polite"></p>
        </div>
        <p class="bb-slot__empty" data-bb-empty hidden>Pieces are being added now. Check back soon.</p>
      </fieldset>
    
  </div>

  <div class="bb-picker__bar">
    <p class="bb-picker__summary" data-bb-summary aria-live="polite">Pick a top and a bottom to see your set.</p>
    <p class="bb-picker__total"><span data-bb-total></span><small></small></p>
    <button class="bb-pill bb-pill--static" type="button" data-bb-add disabled>Add set to bag</button>
    <p class="bb-picker__error" data-bb-error role="alert" hidden></p>
  </div>
