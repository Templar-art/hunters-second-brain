<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-comp-b-mirror-row.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6d7dd}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-nav-menu region text" data-region="nav-menu"><!-- MENU link, plum caps --><p style="font-size:var(--r-nav-menu-font);line-height:1.05;margin:0">nav-menu</p></div>
  <figure class="r-logo region plate" data-region="logo"><img src="../../../assets/plates/logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-bag region control" data-region="bag"><!-- bag outline icon, plum: rebuild the control's chrome from the crop (comp-spec.mjs --crop bag); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline region text" data-region="headline"><!-- Find your colour. heavy plum sans, two lines --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <figure class="r-mirror-1 region plate" data-region="mirror-1"><img src="../../../assets/plates/mirror-1.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-mirror-2 region plate" data-region="mirror-2"><img src="../../../assets/plates/mirror-2.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-mirror-3 region plate" data-region="mirror-3"><img src="../../../assets/plates/mirror-3.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-label-1 region text" data-region="label-1"><!-- BABY PINK caption --><p style="font-size:var(--r-label-1-font);line-height:1.05;margin:0">label-1</p></div>
  <div class="r-label-2 region text" data-region="label-2"><!-- LILAC caption --><p style="font-size:var(--r-label-2-font);line-height:1.05;margin:0">label-2</p></div>
  <div class="r-label-3 region text" data-region="label-3"><!-- COBALT caption --><p style="font-size:var(--r-label-3-font);line-height:1.05;margin:0">label-3</p></div>
  <div class="r-link-minimal region text" data-region="link-minimal"><!-- SHOP THE MINIMAL SET link --><p style="font-size:var(--r-link-minimal-font);line-height:1.05;margin:0">link-minimal</p></div>
  <div class="r-link-strong region text" data-region="link-strong"><!-- SHOP THE STRONG SET link --><p style="font-size:var(--r-link-strong-font);line-height:1.05;margin:0">link-strong</p></div>
  <div class="r-rule region chrome" data-region="rule"><!-- thin blush-rose rule under the links --></div>
  <div class="r-cta region control" data-region="cta"><!-- plum rounded pill button SHOP ALL SETS: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
