<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENTIC OS — 10x</title>
<style>
  :root {
    --bg: #0d0d0c; --card: #161614; --card2: #1d1d1a; --line: #292926;
    --text: #e6e2d8; --dim: #8a867c; --faint: #55524a;
    --orange: #e08543; --cream: #d9d2c0; --yellow: #e0bd63; --green: #7dc98f; --red: #e06c4f; --blue: #61a8d8;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; padding: 16px clamp(12px, 3vw, 40px) 60px; }
  a { color: inherit; }

  header { display: flex; align-items: center; gap: 12px; padding: 4px 0 14px; }
  .logo { letter-spacing: .3em; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .logo canvas { width: 34px; height: 34px; }
  .hbtn { margin-left: auto; display: flex; gap: 8px; }
  .hbtn > * { background: none; border: 1px solid var(--line); color: var(--orange); font-family: var(--mono); font-size: 10px; letter-spacing: .2em; padding: 5px 12px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
  .hbtn .ref { color: var(--dim); padding: 5px 9px; }
  .hbtn > *:hover { border-color: var(--dim); }

  nav { display: flex; gap: 8px; margin-bottom: 14px; }
  nav button { background: var(--card2); border: 1px solid var(--line); color: var(--dim); font-family: var(--mono); font-size: 10px; letter-spacing: .25em; padding: 7px 16px; border-radius: 3px; cursor: pointer; text-transform: uppercase; }
  nav button.on { color: var(--text); background: #232320; }

  .grid { display: grid; gap: 10px; }
  .stats { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 13px 14px; position: relative; display: flex; align-items: center; gap: 12px; overflow: hidden; }
  .stat .txt { flex: 1; min-width: 0; }
  .stat .k { font-size: 9.5px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
  .stat .v { font-size: 27px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .stat .d { font-size: 10px; margin-top: 4px; color: var(--faint); }
  .stat .d.up { color: var(--green); } .stat .d.warn { color: var(--red); }
  .stat .dot { position: absolute; top: 10px; right: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .tile { width: 46px; height: 46px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
  .tile.o { background: radial-gradient(circle at 30% 30%, #4a2c17, #241610); color: var(--orange); }
  .tile.y { background: radial-gradient(circle at 30% 30%, #44381a, #221d10); color: var(--yellow); }
  .tile.b { background: radial-gradient(circle at 30% 30%, #1d3346, #131c24); color: var(--blue); }
  .tile.g { background: radial-gradient(circle at 30% 30%, #1e3a28, #121e16); color: var(--green); }

  .strip { background: linear-gradient(90deg, #201812, var(--card) 45%); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; position: relative; }
  .strip .play { color: var(--orange); font-size: 15px; }
  .strip .lbl { font-size: 9px; letter-spacing: .25em; color: var(--orange); text-transform: uppercase; position: absolute; top: 7px; left: 45px; }
  .strip .title { font-size: 12.5px; margin-top: 10px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .strip .meta { font-size: 10px; color: var(--dim); white-space: nowrap; }
  .strip .meta b { color: var(--text); font-weight: 700; }
  .strip .age { font-size: 9.5px; letter-spacing: .15em; color: var(--faint); text-transform: uppercase; }
  .strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }

  .buttons { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 12px; }
  button.action, a.action { background: var(--card2); border: 1px solid var(--line); color: #c9c4b8; font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; padding: 13px 8px; border-radius: 4px; cursor: pointer; text-align: center; text-decoration: none; transition: background .15s; }
  button.action:hover:not(:disabled), a.action:hover { background: #26261f; }
  button.action:disabled { opacity: .35; cursor: not-allowed; }
  button.action.running { color: var(--orange); border-color: #4a3a20; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  .term { background: #111110; border: 1px solid var(--line); border-radius: 6px; padding: 13px 16px; margin-bottom: 12px; font-size: 12px; line-height: 1.6; color: #a8a396; white-space: pre-wrap; max-height: 300px; overflow-y: auto; min-height: 46px; }
  .muted { color: var(--faint); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
  .panel h2 { font-size: 10px; letter-spacing: .2em; color: var(--orange); text-transform: uppercase; margin-bottom: 11px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .panel h2 .rng { color: var(--faint); letter-spacing: .1em; font-weight: 400; }
  .panel h2 .right { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--dim); font-weight: 400; letter-spacing: .1em; }
  .panel h2 .right a, .panel h2 .right button { background: none; border: 1px solid var(--line); color: var(--dim); font-family: var(--mono); font-size: 9px; letter-spacing: .15em; padding: 3px 9px; border-radius: 3px; cursor: pointer; text-transform: uppercase; text-decoration: none; }
  .panel h2 .right a:hover, .panel h2 .right button:hover { color: var(--orange); border-color: var(--orange); }
  .wr li { font-size: 12px; line-height: 1.65; color: #c2bdb0; list-style: none; padding: 2px 0; }
  .wr li::before { content: "· "; color: var(--orange); }
  .wr b { color: var(--text); }

  .legend { display: flex; gap: 16px; font-size: 9.5px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; margin: 14px 0 10px; }
  .legend span::before { content: "●"; margin-right: 5px; }
  .legend .l-del::before { color: var(--green); } .legend .l-rev::before { color: var(--yellow); }
  .legend .l-int::before { color: var(--cream); } .legend .l-stl::before { color: var(--red); }
  .chart { display: flex; gap: 14px; align-items: flex-end; height: 150px; padding-top: 16px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .bar .bv { font-size: 10px; color: var(--dim); margin-bottom: 5px; }
  .bar .bk { width: 100%; border-radius: 2px 2px 0 0; min-height: 3px; }
  .bar .bl { font-size: 9px; color: var(--faint); margin-top: 7px; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { font-size: 9.5px; letter-spacing: .15em; color: var(--dim); text-transform: uppercase; text-align: left; padding: 4px 10px 8px 0; }
  td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td a { text-decoration: none; border-bottom: 1px dotted var(--faint); }
  td a:hover { color: var(--orange); border-color: var(--orange); }
  .tag { font-size: 9.5px; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); letter-spacing: .1em; text-transform: uppercase; }
  .tag.delivered { color: var(--green); } .tag.generating, .tag.review { color: var(--yellow); }
  .tag.intake, .tag.unknown { color: var(--dim); }
  ul.plain { list-style: none; } ul.plain li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: #c2bdb0; }
  ul.plain li:first-child { border-top: 0; }
  .pg { color: var(--orange); font-size: 11px; margin-right: 8px; text-decoration: none; }
  .pg:hover { text-decoration: underline; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  #daily { font-size: 12px; white-space: pre-wrap; color: #a8a396; max-height: 340px; overflow-y: auto; line-height: 1.6; }
  #killBtn { display: none; }
  .tab { display: none; } .tab.on { display: block; }
</style>
</head>
<body>
<header>
  <div class="logo"><canvas id="orb" width="68" height="68"></canvas> AGENTIC OS</div>
  <div class="hbtn">
    <button id="liveDot">Live</button>
    <button class="ref" id="refreshBtn">↻</button>
  </div>
</header>

<nav id="tabs">
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="jobs">[ Jobs ]</button>
  <button data-tab="vault">[ Vault ]</button>
</nav>

<div class="grid stats" id="stats"></div>

<div class="strip" id="strip">
  <div class="play">▶</div>
  <div class="lbl">Latest Activity</div>
  <div class="title" id="stripTitle">—</div>
  <div class="meta" id="stripMeta"></div>
  <div class="age" id="stripAge"></div>
  <div class="dot"></div>
</div>

<div class="grid buttons" id="buttons"></div>

<div class="term" id="term"><span class="muted">> press a button to run an action — output streams here
> <span id="runState">idle</span></span></div>

<div class="tab on" id="tab-overview">
  <div class="panel">
    <h2>$ Week Review <span class="rng" id="wrRange"></span>
      <span class="right"><a id="wrFull" href="#" style="display:none">Full ↗</a><button id="wrRun">↻</button><button id="killBtn">kill</button></span>
    </h2>
    <ul class="wr" id="wrBullets"><li class="muted">no weekly review yet — first one runs Sunday 4:53pm, or press ↻</li></ul>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="cols">
    <div class="panel"><h2>Today's Note <span class="right"><a id="dailyObs" href="#">Open Today</a><span id="dailyPath"></span></span></h2><div id="daily"></div></div>
    <div class="panel"><h2>Follow-ups</h2><ul class="plain" id="followups"></ul></div>
  </div>
</div>

<div class="tab" id="tab-jobs">
  <div class="panel"><h2>Jobs <span class="right">click client → JOB.md in Obsidian</span></h2><table id="jobs"></table></div>
</div>

<div class="tab" id="tab-vault">
  <div class="panel"><h2>Wiki Log</h2><ul class="plain" id="log"></ul></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let vaultName = 'Hunters Second Brain'; // updated from /api/data on load
const obsUrl = (path) => `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(path.replace(/\.md$/, ''))}`;
let running = false;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- tabs ---------- */
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + b.dataset.tab));
});

/* ---------- jarvis mini-orb ---------- */
const orb = $('orb'), octx = orb.getContext('2d');
const PTS = [];
for (let i = 0; i < 240; i++) {
  const y = 1 - (i / 239) * 2, r = Math.sqrt(1 - y * y), t = i * 2.39996;
  PTS.push([Math.cos(t) * r, y, Math.sin(t) * r]);
}
let rot = 0, speed = 0.005, mix = 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawOrb() {
  speed += ((running ? 0.035 : 0.005) - speed) * 0.04;
  mix += ((running ? 1 : 0) - mix) * 0.05;
  rot += speed;
  octx.clearRect(0, 0, 68, 68);
  for (const [x0, y0, z0] of PTS) {
    const x = x0 * Math.cos(rot) - z0 * Math.sin(rot), z = x0 * Math.sin(rot) + z0 * Math.cos(rot);
    const p = 1.6 / (1.6 - z * 0.9), d = (z + 1) / 2;
    const r = Math.round(97 + 127 * mix), g = Math.round(168 - 35 * mix), b = Math.round(216 - 149 * mix);
    octx.fillStyle = `rgba(${r},${g},${b},${0.1 + d * 0.6})`;
    octx.beginPath();
    octx.arc(34 + x * 24 * p, 34 + y0 * 24 * p, (0.4 + d * 0.9) * p, 0, 7);
    octx.fill();
  }
  if (!reduced) requestAnimationFrame(drawOrb);
}
drawOrb();

/* ---------- data ---------- */
const STATUS_COLOR = { delivered: 'var(--green)', review: 'var(--yellow)', generating: 'var(--yellow)', intake: 'var(--cream)', unknown: 'var(--cream)' };
const BAR_COLORS = ['#d9d2c0', '#e08543', '#e0bd63', '#7dc98f', '#61a8d8'];

async function refresh() {
  let d;
  try { d = await (await fetch('/api/data')).json(); }
  catch { $('liveDot').textContent = 'Offline'; $('liveDot').style.color = 'var(--red)'; return; }
  $('liveDot').textContent = 'Live'; $('liveDot').style.color = 'var(--orange)';
  if (d.vaultName) vaultName = d.vaultName;

  const stalled = d.jobs.filter(j => !/delivered/i.test(j.status)).length && '';
  $('stats').innerHTML = [
    ['b', '▣', 'Active Jobs', d.stats.activeJobs, d.stats.totalJobs + ' tracked total', ''],
    ['o', '¢', 'Credits Spent', d.stats.creditsSpent.toLocaleString(), '$' + d.stats.audSpent.toFixed(0) + ' AUD all jobs', 'warn'],
    ['g', '✎', 'Pages Updated', d.stats.pagesUpdatedWeek, '▲ last 7 days', 'up'],
    ['y', '◷', 'Follow-ups', d.stats.followups, 'waiting on someone', ''],
  ].map(([t, ic, k, v, s, cls]) =>
    `<div class="stat"><div class="dot"></div><div class="txt"><div class="k">${k}</div><div class="v">${v}</div><div class="d ${cls}">${s}</div></div><div class="tile ${t}">${ic}</div></div>`).join('');

  // latest activity strip = newest wiki log entry
  const latest = d.log[0] || '';
  const m = latest.match(/^## \[(\d{4}-\d{2}-\d{2})\]\s*(.*)$/);
  $('stripTitle').textContent = m ? m[2] : 'no log entries yet';
  $('stripMeta').innerHTML = `<b>${d.stats.activeJobs}</b> ACTIVE · <b>${d.stats.creditsSpent}</b> CREDITS · <b>${d.stats.followups}</b> WAITING`;
  if (m) {
    const days = Math.max(0, Math.round((Date.now() - Date.parse(m[1])) / 86400e3));
    $('stripAge').textContent = days === 0 ? 'TODAY' : days + 'D OLD';
  }

  if (!running) $('buttons').innerHTML = d.actions.map(a =>
    `<button class="action" data-id="${a.id}" title="${esc(a.disabled ? (a.disabledReason || '') : a.description)}" ${a.disabled ? 'disabled' : ''}>${esc(a.label)}</button>`).join('') +
    `<a class="action" href="${obsUrl(d.daily.path)}">Open Today</a>`;

  // week review panel
  if (d.weekly) {
    $('wrRange').textContent = d.weekly.date;
    $('wrFull').style.display = 'inline-block';
    $('wrFull').href = obsUrl(d.weekly.path);
    $('wrBullets').innerHTML = d.weekly.bullets.map(b => `<li>${esc(b).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`).join('');
  }
  const counts = { delivered: 0, review: 0, intake: 0 };
  d.jobs.forEach(j => { counts[/delivered/i.test(j.status) ? 'delivered' : /review|generating/i.test(j.status) ? 'review' : 'intake']++; });
  $('legend').innerHTML = `<span class="l-del">Delivered ${counts.delivered}</span><span class="l-rev">In Flight ${counts.review}</span><span class="l-int">Intake ${counts.intake}</span>`;
  const maxC = Math.max(...d.jobs.map(j => j.credits), 1);
  $('chart').innerHTML = d.jobs.map((j, i) =>
    `<div class="bar"><div class="bv">${j.credits.toLocaleString()}</div><div class="bk" style="height:${Math.round(j.credits / maxC * 100)}%;background:${BAR_COLORS[i % BAR_COLORS.length]}"></div><div class="bl">${esc(j.client)}</div></div>`).join('');

  $('dailyPath').textContent = d.daily.path;
  $('dailyObs').href = obsUrl(d.daily.path);
  $('daily').textContent = d.daily.exists ? d.daily.content : `> no daily note at ${d.daily.path}\nclick "Open Today" above or run Morning Brief`;

  $('jobs').innerHTML = '<tr><th>Client</th><th>Address</th><th>Status</th><th>Credits</th><th>AUD</th></tr>' +
    d.jobs.map(j => `<tr><td><a href="${obsUrl(j.path)}">${esc(j.client)}</a></td><td>${esc(j.address)}</td><td><span class="tag ${esc(j.status)}">${esc(j.status)}</span></td><td>${j.credits.toLocaleString()}</td><td>$${j.aud.toFixed(0)}</td></tr>`).join('');

  $('followups').innerHTML = d.followupLines.map(f => `<li><a class="pg" href="${f.path ? obsUrl(f.path) : '#'}">${esc(f.page)}</a>${esc(f.line)}</li>`).join('') || '<li class="muted">none detected</li>';
  $('log').innerHTML = d.log.map(l => `<li>${esc(l.replace('## ', ''))}</li>`).join('');
}

/* ---------- runs ---------- */
async function runAction(id, btn) {
  if (running) return;
  running = true;
  if (btn) btn.classList.add('running');
  document.querySelectorAll('button.action').forEach(b => { if (b !== btn) b.disabled = true; });
  $('killBtn').style.display = 'inline-block';
  const term = $('term'); term.textContent = '';
  try {
    const res = await fetch('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      term.textContent += dec.decode(value, { stream: true });
      term.scrollTop = term.scrollHeight;
    }
  } catch (err) { term.textContent += '\n> stream error: ' + err.message; }
  running = false;
  $('killBtn').style.display = 'none';
  refresh();
}
$('buttons').addEventListener('click', (e) => {
  const btn = e.target.closest('button.action');
  if (btn) runAction(btn.dataset.id, btn);
});
$('wrRun').addEventListener('click', () => runAction('weekly-review', null));
$('killBtn').addEventListener('click', () => fetch('/api/kill', { method: 'POST', headers: { 'content-type': 'application/json' } }));
$('refreshBtn').addEventListener('click', refresh);

refresh();
setInterval(() => { if (!running) refresh(); }, 30000);
</script>
</body>
</html>
