<title>10x Logo Animation</title>
<style>
:root{--bg:#0b1b26;--navy:#102f41;--blue:#61a8d8;--kicker:#8ec6e8;}
body{background:var(--bg);}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,var(--navy),var(--bg) 72%);overflow:hidden;}
.mark{width:240px;height:auto;overflow:visible;animation:shake 1s linear 0s forwards;}
#glowGroup{animation:glow 3s ease-in-out 1.5s infinite;}

#strokeUpper,#strokeLower,.numTen{transform-box:fill-box;transform-origin:center;opacity:0;}
#strokeUpper{animation:sliceRight .36s cubic-bezier(.2,.95,.25,1) 0s forwards;}
#strokeLower{animation:sliceLeft .36s cubic-bezier(.2,.95,.25,1) 0s forwards;}
.numTen{animation:tenSwipe .34s cubic-bezier(.16,.92,.22,1) .44s forwards;}
.hitX{animation:hitX .18s ease-out .33s forwards;}
.hitTen{animation:hitTen .18s ease-out .75s forwards;}

@keyframes sliceRight{
  0%{opacity:0;transform:translateX(200px);filter:blur(5px);}
  35%{opacity:1;}
  70%{filter:blur(0);}
  84%{transform:translateX(-7px);}
  100%{opacity:1;transform:translateX(0);filter:blur(0);}
}
@keyframes sliceLeft{
  0%{opacity:0;transform:translateX(-200px);filter:blur(5px);}
  35%{opacity:1;}
  70%{filter:blur(0);}
  84%{transform:translateX(7px);}
  100%{opacity:1;transform:translateX(0);filter:blur(0);}
}
@keyframes tenSwipe{
  0%{opacity:0;transform:translateX(-260px) skewX(9deg);filter:blur(6px);}
  35%{opacity:1;}
  70%{filter:blur(0);}
  85%{transform:translateX(11px) skewX(-2deg);}
  100%{opacity:1;transform:translateX(0) skewX(0);filter:blur(0);}
}
@keyframes hitX{
  0%{filter:brightness(1);}
  20%{filter:brightness(2.3) saturate(.45);}
  100%{filter:brightness(1);}
}
@keyframes hitTen{
  0%{filter:brightness(1);}
  20%{filter:brightness(1.5);}
  100%{filter:brightness(1);}
}
@keyframes shake{
  0%,34%{transform:translate(0,0);}
  36%{transform:translate(-5px,3px);}
  39%{transform:translate(4px,-2px);}
  42%{transform:translate(-2px,1px);}
  45%,75%{transform:translate(0,0);}
  77%{transform:translate(3px,2px);}
  80%{transform:translate(-2px,-1px);}
  83%,100%{transform:translate(0,0);}
}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(97,168,216,0));}
  50%{filter:drop-shadow(0 0 15px rgba(97,168,216,.45));}
}
.replay{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:transparent;border:1px solid var(--kicker);color:var(--kicker);font-family:Poppins,Montserrat,sans-serif;font-size:13px;letter-spacing:1px;padding:8px 18px;border-radius:20px;cursor:pointer;}
.replay:hover{background:rgba(142,198,232,.1);}
</style>

<button class="replay" onclick="replay()">Replay</button>
<script>
const ANIM=[
  ['#strokeUpper','sliceRight .36s cubic-bezier(.2,.95,.25,1) 0s forwards'],
  ['#strokeLower','sliceLeft .36s cubic-bezier(.2,.95,.25,1) 0s forwards'],
  ['.numTen','tenSwipe .34s cubic-bezier(.16,.92,.22,1) .44s forwards'],
  ['.hitX','hitX .18s ease-out .33s forwards'],
  ['.hitTen','hitTen .18s ease-out .75s forwards'],
  ['#mark','shake 1s linear 0s forwards'],
  ['#glowGroup','glow 3s ease-in-out 1.5s infinite'],
];
function replay(){
  ANIM.forEach(([sel])=>document.querySelectorAll(sel).forEach(el=>el.style.animation='none'));
  void document.getElementById('mark').offsetWidth;
  ANIM.forEach(([sel,anim])=>document.querySelectorAll(sel).forEach(el=>el.style.animation=anim));
}
</script>
