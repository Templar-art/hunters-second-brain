<title>10x Logo Animation</title>
<style>
:root{--bg:#0b1b26;--navy:#102f41;--blue:#61a8d8;--kicker:#8ec6e8;}
html,body{margin:0;padding:0;}
body{background:var(--bg);}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,var(--navy),var(--bg) 74%);overflow:hidden;}
.mark{width:240px;height:auto;overflow:visible;}

/* resting state — also the reset state between replays */
#strokeUpper,#strokeLower,.numTen{transform-box:fill-box;transform-origin:center;opacity:0;}

/* Long-tail deceleration, no overshoot, no impact. Weight comes from the curve. */
.play #strokeUpper{animation:glideRight 1s cubic-bezier(.19,1,.22,1) .1s forwards;}
.play #strokeLower{animation:glideLeft 1s cubic-bezier(.19,1,.22,1) .1s forwards;}
.play .numTen{animation:tenGlide .95s cubic-bezier(.19,1,.22,1) .5s forwards;}
.play #glowGroup{animation:glow 2.6s ease-in-out .95s infinite;}

@keyframes glideRight{
  0%{opacity:0;transform:translateX(120px);filter:blur(4px);}
  55%{opacity:1;}
  75%{filter:blur(0);}
  100%{opacity:1;transform:translateX(0);filter:blur(0);}
}
@keyframes glideLeft{
  0%{opacity:0;transform:translateX(-120px);filter:blur(4px);}
  55%{opacity:1;}
  75%{filter:blur(0);}
  100%{opacity:1;transform:translateX(0);filter:blur(0);}
}
@keyframes tenGlide{
  0%{opacity:0;transform:translateX(-165px);filter:blur(5px);}
  55%{opacity:1;}
  75%{filter:blur(0);}
  100%{opacity:1;transform:translateX(0);filter:blur(0);}
}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(97,168,216,0));}
  50%{filter:drop-shadow(0 0 20px rgba(97,168,216,.3));}
}
@media (prefers-reduced-motion:reduce){
  #strokeUpper,#strokeLower,.numTen{opacity:1;}
  .play #strokeUpper,.play #strokeLower,.play .numTen,.play #glowGroup{animation:none;}
}
.replay{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:transparent;border:1px solid var(--kicker);color:var(--kicker);font-family:Poppins,Montserrat,sans-serif;font-size:13px;letter-spacing:1px;padding:8px 18px;border-radius:20px;cursor:pointer;}
.replay:hover{background:rgba(142,198,232,.1);}
</style>

<button class="replay" onclick="replay()">Replay</button>
<script>
function replay(){
  const s=document.getElementById('stage');
  s.classList.remove('play');
  void s.offsetWidth;
  s.classList.add('play');
}
</script>
