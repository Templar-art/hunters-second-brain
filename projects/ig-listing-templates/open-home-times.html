<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Home Times</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <div class="hero hero--placeholder">
      <div class="placeholder-mark">Listing photo</div>
    </div>
    <div class="scrim"></div>
    <div class="content">
      <div class="kicker">Open Home</div>
      <div class="headline">123 Example Street,<br>Suburb</div>
      <div class="times">
        <div class="slot"><span>Sat</span>10:00am &ndash; 10:30am</div>
        <div class="slot"><span>Sun</span>11:00am &ndash; 11:30am</div>
      </div>
      <div class="subtext">Contact the team to arrange a private viewing</div>
    </div>
    <div class="logo-slot">
      <img src="assets/logo-placeholder.svg" alt="Agency logo">
    </div>
  </div>
</body>
</html>
