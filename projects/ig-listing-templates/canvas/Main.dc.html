<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #3ba0e8; } a:hover { color: #ffffff; }
  </style>
</helmet>
<div style="position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #0a1c3e; font-family: 'Nunito Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif; font-kerning: normal;">
  <img src="hero-aerial.jpg" alt="Aerial view of 14 Stonehaven Court, Brookfield" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 280px; background: linear-gradient(180deg, rgba(10,28,62,0.58) 0%, rgba(10,28,62,0) 100%);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: {{scrimFill}};"></div>

  <img src="harcourts-wordmark.png" alt="Harcourts" style="position: absolute; top: 68px; right: 72px; width: 196px; height: auto;">

  <div style="position: absolute; left: 76px; right: 76px; bottom: 84px; display: flex; flex-direction: column; align-items: flex-start; gap: 30px;">
    <div style="background: {{accent}}; color: #0a1c3e; font-size: 24px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 11px 20px;">Just Listed</div>
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px;">
      <div style="font-size: 56px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; color: #ffffff; text-wrap: balance;">14 Stonehaven Court, Brookfield</div>
      <div style="font-size: 26px; font-weight: 600; color: rgba(255,255,255,0.92);">Offers over [YOUR PRICE]</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#3ba0e8","options":["#3ba0e8","#ffffff","#0a1c3e"]},"scrim":{"editor":"range","default":0.86,"min":0.4,"max":1,"step":0.02},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.scrim ?? 0.86;
    return {
      accent: this.props.accent ?? '#3ba0e8',
      scrimFill: `linear-gradient(180deg, rgba(10,28,62,0) 0%, rgba(10,28,62,${(s * 0.46).toFixed(3)}) 42%, rgba(10,28,62,${s.toFixed(3)}) 100%)`
    };
  }
}
</script>
</body>
</html>
