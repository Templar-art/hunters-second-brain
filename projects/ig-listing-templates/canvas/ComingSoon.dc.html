<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #3ba0e8; } a:hover { color: #ffffff; }
  </style>
</helmet>
<div style="position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #0a1c3e; font-family: 'Jost', 'Century Gothic', 'Avenir Next', system-ui, sans-serif;">
  <img src="hero-pool.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 280px; background: linear-gradient(180deg, rgba(10,28,62,0.58) 0%, rgba(10,28,62,0) 100%);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: {{scrimFill}};"></div>

  <img src="harcourts-wordmark.png" alt="Harcourts" style="position: absolute; top: 68px; right: 72px; width: 196px; height: auto;">

  <div style="position: absolute; left: 76px; right: 76px; bottom: 84px; display: flex; flex-direction: column; align-items: flex-start; gap: 0;">
    <div style="width: 58px; height: 2px; background: {{accent}};"></div>
    <div style="margin-top: 24px; font-size: 21px; font-weight: 500; letter-spacing: 0.3em; color: #ffffff;">COMING SOON</div>
    <div style="margin-top: 22px; font-size: 56px; font-weight: 300; line-height: 1.08; color: #ffffff; text-wrap: balance;">14 Stonehaven Court</div>
    <div style="margin-top: 16px; font-size: 22px; font-weight: 300; letter-spacing: 0.24em; color: rgba(255,255,255,0.85);">BROOKFIELD QLD</div>
    <div style="margin-top: 26px; font-size: 21px; font-weight: 300; letter-spacing: 0.05em; color: rgba(255,255,255,0.85);">To market [MONTH]</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#3ba0e8","options":["#3ba0e8","#ffffff","#0a1c3e"]},"scrim":{"editor":"range","default":0.86,"min":0.4,"max":1,"step":0.02},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.scrim ?? 0.86;
    return {
      accent: this.props.accent ?? '#3ba0e8',
      scrimFill: `linear-gradient(180deg, rgba(10,28,62,0) 0%, rgba(10,28,62,${(s * 0.46).toFixed(3)}) 42%, rgba(10,28,62,${s.toFixed(3)}) 100%)`
    };
  }
}
</script>
</body>
</html>
