<style>html,body{margin:0;background:#141413}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, DUR = 15;
const g = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
function spring(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const C = '#F0EEE6', A = '#D97757';
const SCENES = [
  { from: 0, to: 3, draw(t) {
      const s = spring(t - 0.1, 220, 22);
      g.save(); g.translate(W / 2, H / 2); g.scale(0.6 + 0.4 * s, 0.6 + 0.4 * s);
      g.globalAlpha = clamp(t * 4);
      g.fillStyle = C; g.font = '700 190px "Source Serif 4", serif';
      g.textAlign = 'center'; g.fillText('MOTION', 0, 0);
      g.fillStyle = A; g.fillRect(-320 * s, 50, 640 * s, 18);
      g.restore();
  }},
  { from: 3, to: 6, draw(t) {
      const r = rng(7);
      for (let i = 0; i < 48; i++) {
        const x = (i % 6) * 170 + 115, y = Math.floor(i / 6) * 170 + 360;
        const s = spring(t - i * 0.03 - r() * 0.1, 260, 20);
        g.fillStyle = i % 7 ? C : A;
        g.fillRect(x - 60 * s, y - 60 * s, 120 * s, 120 * s);
      }
  }},
  { from: 6, to: 9, draw(t) {                         // orbiting dots + pulsing ring
      const s = spring(t, 120, 14);
      g.save(); g.translate(W / 2, H / 2);
      g.strokeStyle = A; g.lineWidth = 14;
      g.beginPath(); g.arc(0, 0, 300 * s, 0, Math.PI * 2); g.stroke();
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2 + t * 1.6, rr = 300 * s + 120 * Math.sin(t * 3 + i);
        g.fillStyle = C; g.beginPath(); g.arc(Math.cos(a) * rr, Math.sin(a) * rr, 26 * clamp(t * 3 - i * 0.15), 0, 7); g.fill();
      }
      g.restore();
  }},
  { from: 9, to: 12, draw(t) {                        // bars wipe in, equaliser
      for (let i = 0; i < 9; i++) {
        const s = spring(t - i * 0.08, 200, 18);
        const h = (300 + 500 * Math.abs(Math.sin(t * 2.5 + i * 0.7))) * s;
        g.fillStyle = i === 4 ? A : C;
        g.fillRect(90 + i * 105, H / 2 + 400 - h, 70, h);
      }
  }},
  { from: 12, to: 15, draw(t) {                       // outro word slam + fade
      const s = spring(t - 0.05, 300, 18);
      g.save(); g.translate(W / 2, H / 2); g.globalAlpha = 1 - clamp((t - 2.4) * 2);
      g.scale(2.2 - 1.2 * s, 2.2 - 1.2 * s);
      g.fillStyle = A; g.font = '700 220px "Source Serif 4", serif'; g.textAlign = 'center';
      g.fillText('10x', 0, 60);
      g.restore();
  }},
];
function draw(t) {
  g.fillStyle = '#141413'; g.fillRect(0, 0, W, H);
  for (const s of SCENES) if (t >= s.from && t < s.to) s.draw(t - s.from);
}
window.seek = (t) => { draw(t); return true; };
if (!navigator.webdriver) { const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }
</script>
