<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// USE Software: CRUD talking head. Layout + motion grammar matched to the AI Defence reference,
// colour + type from usesoftware.com.au (blue #009BEB → cyan #01E5EE, Barlow Condensed / Barlow).
// Transparent pixels show the talking-head layer underneath: full frame in the hook, PiP hole after.
const W = 1080, H = 1920, DUR = 22.5, X = 80, RW = 920;
const g = document.getElementById('c').getContext('2d');
const BG = '#070B12', WHITE = '#F3F6FA', B1 = '#009BEB', B2 = '#01E5EE', GREY = '#8B95A5', RULE = '#1E2836';
const HEAD = '"Barlow Condensed", sans-serif', BODY = 'Barlow, sans-serif', MONO = '"JetBrains Mono", monospace';
const PIP = { x: 660, y: 1380, w: 340, h: 440, r: 30 };           // must match the ffmpeg overlay in build.sh
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const expo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };   // reference rise curve
const inOut = x => { x = clamp(x); return x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function grad(x0, x1) { const q = g.createLinearGradient(x0, 0, x1, 0); q.addColorStop(0, B1); q.addColorStop(1, B2); return q; }
const LOGO = new Image(); LOGO.src = 'assets/use-logo-long-white.png';

// ---------- primitives (all pure functions of t) ----------
// Mono label: types on at 26 cps, uppercase, tracked — same as the reference.
function label(txt, y, t, col = GREY, x = X, size = 28) {
  if (t <= 0) return; const n = Math.floor(clamp(t * 26, 0, txt.length));
  g.font = `500 ${size}px ${MONO}`; g.letterSpacing = '5px'; g.fillStyle = col;
  g.fillText(txt.slice(0, n).toUpperCase(), x, y); g.letterSpacing = '0px';
}
// Hairline rule draws left→right.
function rule(y, t, x = X, w = RW) { if (t <= 0) return; g.fillStyle = RULE; g.fillRect(x, y, w * expo(t / .6), 2); }
// Headline: each line rises out of its own mask on an expo-out, lines staggered 70ms.
// Segments: [[text, accent?], ...] per line.
function head(lines, y, t, { size = 150, lh = .92, x = X, w = 700, font = HEAD } = {}) {
  lines.forEach((segs, i) => {
    const p = expo((t - i * .07) / .55); if (p <= 0) return;
    const ly = y + i * size * lh;
    g.save(); g.beginPath(); g.rect(0, ly - size * .95, W, size * 1.22); g.clip();
    g.font = `${w} ${size}px ${font}`; let cx = x; const dy = (1 - p) * size * 1.15;
    for (const [txt, acc] of segs) { const tw = g.measureText(txt).width;
      g.fillStyle = acc ? grad(cx, cx + tw) : WHITE; g.fillText(txt, cx, ly + dy); cx += tw; }
    g.restore();
  });
}
function typed(txt, x, y, t, { size = 56, cps = 22, col = WHITE } = {}) {
  if (t <= 0) return; const n = Math.floor(clamp(t * cps, 0, txt.length));
  g.font = `500 ${size}px ${MONO}`; g.fillStyle = col; g.fillText(txt.slice(0, n), x, y);
  if (n < txt.length || Math.floor(t * 2.4) % 2 === 0) {
    const cx = x + g.measureText(txt.slice(0, n)).width + 6;
    g.fillStyle = grad(cx, cx + size * .5); g.fillRect(cx, y - size * .78, size * .48, size * .92);
  }
}
function check(cx, cy, r, t) {
  if (t <= 0) return; const p = expo(t / .5), q = expo((t - .2) / .4);
  g.strokeStyle = grad(cx - r, cx + r); g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); g.stroke();
  if (q > 0) { const pts = [[cx - r * .42, cy + r * .02], [cx - r * .1, cy + r * .32], [cx + r * .45, cy - r * .3]];
    const L1 = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]), L2 = Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]);
    let d = q * (L1 + L2); g.beginPath(); g.moveTo(...pts[0]);
    if (d <= L1) g.lineTo(pts[0][0] + (pts[1][0] - pts[0][0]) * d / L1, pts[0][1] + (pts[1][1] - pts[0][1]) * d / L1);
    else { g.lineTo(...pts[1]); d -= L1; g.lineTo(pts[1][0] + (pts[2][0] - pts[1][0]) * d / L2, pts[1][1] + (pts[2][1] - pts[1][1]) * d / L2); }
    g.stroke(); }
}
// Arrow draws out like the reference "transfer →".
function arrow(x, y, len, t) {
  if (t <= 0) return; const p = expo(t / .6), e = x + len * p;
  g.strokeStyle = grad(x, x + len); g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.lineTo(e, y); g.stroke();
  if (p > .6) { const a = (p - .6) / .4 * 16; g.beginPath(); g.moveTo(e - a, y - a * .7); g.lineTo(e, y); g.lineTo(e - a, y + a * .7); g.stroke(); }
}

// ---------- background: drifting blue network (brand-tinted version of the reference) ----------
const NODES = (() => { const r = rng(11), a = [];
  for (let i = 0; i < 50; i++) a.push({ x: 60 + r() * 960, y: r() * H, ph: r() * 6, s: .5 + r() });
  return a; })();
function network(t) {
  const P = NODES.map(n => ({ x: n.x + Math.sin(t * .25 * n.s + n.ph) * 26, y: n.y + Math.cos(t * .2 * n.s + n.ph) * 26 - t * 6 }));
  g.lineWidth = 1.2;
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const d = Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y);
    if (d < 220) { g.strokeStyle = `rgba(0,155,235,${.13 * (1 - d / 220)})`; g.beginPath(); g.moveTo(P[i].x, P[i].y); g.lineTo(P[j].x, P[j].y); g.stroke(); }
  }
  g.fillStyle = 'rgba(0,175,235,.28)'; for (const p of P) { g.beginPath(); g.arc(p.x, p.y, 2.6, 0, 7); g.fill(); }
}

// ---------- PiP: punch a hole so the face layer shows through, plus frame + tag ----------
function pip(t, out) {                       // t = time since in, out = time until gone (negative = leaving)
  const pin = expo(t / .6), pout = out < 0 ? 0 : expo(out / .4);   // pout: 1 while shown
  const s = Math.min(pin, out === Infinity ? 1 : pout); if (s <= 0) return;
  const { x, y, w, h, r } = PIP, cx = x + w / 2, cy = y + h / 2;
  const sw = w * (.6 + .4 * s), sh = h * (.6 + .4 * s);
  g.save(); g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = clamp(s * 1.6); g.beginPath(); g.roundRect(cx - sw / 2, cy - sh / 2, sw, sh, r); g.fill();
  g.restore();
  // outer frame + gradient keyline
  g.save(); g.globalAlpha = clamp(s * 1.6);
  g.strokeStyle = grad(cx - sw / 2, cx + sw / 2); g.lineWidth = 3;
  g.beginPath(); g.roundRect(cx - sw / 2, cy - sh / 2, sw, sh, r); g.stroke();
  // tag under the frame
  g.font = `500 22px ${MONO}`; g.letterSpacing = '4px'; g.fillStyle = GREY;
  g.fillText('USE SOFTWARE', cx - sw / 2 + 4, cy + sh / 2 + 42); g.letterSpacing = '0px';
  g.fillStyle = grad(0, 0); g.fillStyle = B2; g.beginPath(); g.arc(cx + sw / 2 - 10, cy + sh / 2 + 34, 7, 0, 7); g.fill();
  g.restore();
}

// ---------- scenes. T = global seconds; word times from the VO transcript ----------
const SCENES = [
  { from: 5.0, to: 8.0, draw(T) {                     // C-R-U-D stands for
      label('C-R-U-D stands for', 400, T - 5.42);
      rule(450, T - 5.55);
      [['C', 'reate.', 6.40], ['R', 'ead.', 6.60], ['U', 'pdate.', 7.12], ['D', 'elete.', 7.68]].forEach(([L, rest, at], i) => {
        const y = 650 + i * 200;
        head([[[L, true]]], y, T - 5.45 - i * .08, { size: 190 });          // letters land with the spelling
        g.font = `700 190px ${HEAD}`; const lw = g.measureText(L).width;
        head([[[rest, false]]], y, T - at, { size: 190, x: X + lw });       // rest of the word on the spoken word
        rule(y + 40, T - at - .1);
      });
  }},
  { from: 8.0, to: 10.45, pip: true, draw(T) {        // a methodology for building a REST API
      label('A methodology for', 400, T - 8.04);
      rule(450, T - 8.2);
      head([[['Building', false]]], 640, T - 8.62, { size: 190 });
      head([[['a ', false], ['REST API.', true]]], 815, T - 9.72, { size: 190 });
      rule(880, T - 9.9);
      label('Endpoint', 950, T - 9.95);
      arrow(X, 1030, 300, T - 9.95);
      typed('/api', X + 330, 1050, T - 10.05, { size: 60, cps: 14 });
  }},
  { from: 10.45, to: 15.0, pip: true, draw(T) {       // for any endpoint, e.g. users
      label('For any endpoint', 400, T - 10.76);
      rule(450, T - 10.9);
      head([[["Let's say", false]]], 620, T - 12.3, { size: 190 });
      head([[['Users.', true]]], 830, T - 13.84, { size: 220 });
      const y0 = 940, a = expo((T - 11.5) / .6);          // endpoint card (reference: payments-policy card)
      if (a > 0) { g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 40);
        g.fillStyle = 'rgba(14,20,30,.85)'; g.strokeStyle = RULE; g.lineWidth = 2;
        g.beginPath(); g.roundRect(X, y0, 540, 250, 18); g.fill(); g.stroke();
        label('Endpoint', y0 + 60, T - 11.55, GREY, X + 32, 24);
        label('REST', y0 + 60, T - 11.7, B1, X + 420, 24);
        g.fillStyle = RULE; g.fillRect(X + 32, y0 + 86, 476, 2);
        typed('/api/users', X + 32, y0 + 175, T - 13.84, { size: 58, cps: 24 });
        g.restore(); }
  }},
  { from: 15.0, to: 19.8, pip: true, draw(T) {        // four actions on one endpoint
      label('/api/users · four actions', 400, T - 15.02);
      rule(450, T - 15.1);
      [['POST', 'Create user.', 15.38], ['GET', 'Read user.', 16.62], ['PUT', 'Update user.', 17.58], ['DELETE', 'Delete user.', 18.38]].forEach(([verb, txt, at], i) => {
        const y = 600 + i * 170;
        label(verb, y - 78, T - at, B1, X, 26);
        head([[[txt, false]]], y + 20, T - at, { size: 104 });
        check(X + RW - 46, y - 18, 32, T - at - .3);
        rule(y + 54, T - at - .05);
      });
      label('Every action you can take', 1300, T - 19.0, B2);
  }},
  { from: 19.8, to: 22.5, draw(T) {                   // end card
      label('Create · Read · Update · Delete', 400, T - 19.85);
      rule(450, T - 19.95);
      head([[['Built', false]], [['properly.', true]]], 700, T - 20.05, { size: 230 });
      const p = expo((T - 20.6) / .8);                   // logo wipes in left→right
      if (p > 0 && LOGO.complete) { const lw = 620, lh = lw * LOGO.height / LOGO.width;
        g.save(); g.beginPath(); g.rect(X, 1040, lw * p, lh + 20); g.clip();
        g.drawImage(LOGO, X, 1050, lw, lh); g.restore(); }
      label('usesoftware.com.au', 1200, T - 21.0);
  }},
];

// Hook card over the full-frame talking head (0–5s).
function hook(T) {
  const a = expo(T / .5) * (1 - clamp((T - 4.75) / .2)); if (a <= 0) return;
  const y0 = 1440; g.save(); g.globalAlpha = a; g.translate(0, (1 - expo(T / .6)) * 60);
  g.fillStyle = 'rgba(7,11,18,.9)'; g.beginPath(); g.roundRect(X - 30, y0, RW + 60 - 80, 320, 22); g.fill();
  g.fillStyle = grad(X - 30, X + RW - 50); g.fillRect(X - 30 + 22, y0, RW - 80 + 16, 4);
  label('Dev terms', y0 + 66, T - .15, GREY, X + 10, 26);
  label('CRUD', y0 + 66, T - .3, B1, X + RW - 210, 26);
  g.fillStyle = RULE; g.fillRect(X + 10, y0 + 92, RW - 100, 2);
  head([[['Sounds bad.', false]]], y0 + 200, T - .35, { size: 110, x: X + 10 });
  if (T > 2.76) { g.font = `700 110px ${HEAD}`; g.fillStyle = grad(X, X + 500);
    g.fillRect(X + 10, y0 + 162, g.measureText('Sounds bad.').width * expo((T - 2.76) / .35), 8); }
  head([[['Built well.', true]]], y0 + 290, T - 4.18, { size: 84, x: X + 10 });
  g.restore();
}

function draw(T) {
  g.clearRect(0, 0, W, H);
  if (T < 5.0) { hook(T); }
  // panel wipes up over the talking head 4.85–5.3s (quint in-out), opaque afterwards
  const wipe = inOut((T - 4.85) / .45);
  if (wipe > 0) { g.save(); g.beginPath(); g.rect(0, H * (1 - wipe), W, H * wipe); g.clip();
    g.fillStyle = BG; g.fillRect(0, 0, W, H); network(T); g.restore(); }
  for (const s of SCENES) if (T >= s.from && T < s.to) {        // hard cuts between scenes, like the reference
    s.draw(T);
  }
  // PiP stays up continuously across the three scenes that use it (8.0–19.8)
  if (T >= 8.0 && T < 19.8) pip(T - 8.15, 19.8 - T - .05);
}
window.seek = (t) => { draw(t); return true; };
window.ready = document.fonts.ready
  .then(() => Promise.all([`700 40px "Barlow Condensed"`, `500 40px "JetBrains Mono"`, `600 40px Barlow`].map(f => document.fonts.load(f))))
  .then(() => LOGO.complete ? 0 : new Promise(r => LOGO.onload = r));
if (!navigator.webdriver) { window.ready.then(() => { const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }); }
</script>
</body></html>
