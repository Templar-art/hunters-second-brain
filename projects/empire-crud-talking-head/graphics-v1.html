<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Empire Technologies — CRUD talking-head graphics. Style matched to the Empire "AI Defence" reference.
const W = 1080, H = 1920, DUR = 22.5, X = 80, RW = 860;
const g = document.getElementById('c').getContext('2d');
const BG = '#0A0908', CREAM = '#F2EFE8', ORANGE = '#F47A2A', GREY = '#A8A398', RULE = '#3A3833';
const SANS = '"DM Sans", sans-serif', MONO = '"JetBrains Mono", monospace';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function spring(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- primitives ----------
function mono(txt, x, y, t, { col = GREY, size = 30, track = 6 } = {}) {      // tracked mono label, typed on
  const n = Math.floor(clamp(t * 28, 0, txt.length));
  g.font = `500 ${size}px ${MONO}`; g.fillStyle = col; g.letterSpacing = track + 'px';
  g.fillText(txt.slice(0, n).toUpperCase(), x, y); g.letterSpacing = '0px';
  return n;
}
function rule(y, t, col = RULE) { g.fillStyle = col; g.fillRect(X, y, RW * easeOut(t * 2.5), 2); }
function head(txt, x, y, t, { size = 120, col = CREAM, w = 600 } = {}) {      // slide-up masked headline
  const p = easeOut(t * 3);
  g.save(); g.beginPath(); g.rect(0, y - size * 1.05, W, size * 1.35); g.clip();
  g.font = `${w} ${size}px ${SANS}`; g.fillStyle = col; g.letterSpacing = (-size * 0.012) + 'px';
  g.fillText(txt, x, y + (1 - p) * size * 1.2); g.letterSpacing = '0px'; g.restore();
}
function typed(txt, x, y, t, { size = 40, col = CREAM, font = SANS, w = 500, cps = 30, cursor = true } = {}) {
  const n = Math.floor(clamp(t * cps, 0, txt.length));
  g.font = `${w} ${size}px ${font}`; g.fillStyle = col; g.fillText(txt.slice(0, n), x, y);
  if (cursor && t > 0 && (n < txt.length || Math.floor(t * 2.5) % 2 === 0)) {
    const cx = x + g.measureText(txt.slice(0, n)).width + 6;
    g.fillStyle = ORANGE; g.fillRect(cx, y - size * 0.78, size * 0.42, size * 0.92);
  }
}
function check(cx, cy, r, t) {
  const p = easeOut(t * 2.2); if (p <= 0) return;
  g.strokeStyle = ORANGE; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); g.stroke();
  const q = easeOut(t * 2.2 - 0.6);
  if (q > 0) { g.beginPath(); g.moveTo(cx - r * .42, cy);
    const a = [cx - r * .1, cy + r * .32], b = [cx + r * .45, cy - r * .32];
    if (q < .4) g.lineTo(cx - r * .42 + (a[0] - cx + r * .42) * q / .4, cy + (a[1] - cy) * q / .4);
    else { g.lineTo(...a); const k = (q - .4) / .6; g.lineTo(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k); }
    g.stroke(); }
}
function fadeOut(t, end) { return 1 - clamp((t - end + 0.25) / 0.25); }

// ---------- background constellation (drifting, like the reference) ----------
const NODES = (() => { const r = rng(42), a = [];
  for (let i = 0; i < 46; i++) a.push({ x: 120 + r() * 880, y: r() * H, vx: (r() - .5) * 6, vy: (r() - .5) * 6, ph: r() * 6 });
  return a; })();
function constellation(t, alpha) {
  const P = NODES.map(n => ({ x: n.x + n.vx * t + Math.sin(t * .4 + n.ph) * 10, y: n.y + n.vy * t + Math.cos(t * .3 + n.ph) * 10 }));
  g.globalAlpha = alpha; g.lineWidth = 1.2;
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const d = Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y);
    if (d < 230) { g.strokeStyle = `rgba(150,145,135,${0.16 * (1 - d / 230)})`; g.beginPath(); g.moveTo(P[i].x, P[i].y); g.lineTo(P[j].x, P[j].y); g.stroke(); }
  }
  g.fillStyle = 'rgba(150,145,135,0.35)'; for (const p of P) { g.beginPath(); g.arc(p.x, p.y, 3, 0, 7); g.fill(); }
  g.globalAlpha = 1;
}

// ---------- Empire Technologies mark (vector redraw of the logo) ----------
const LN = [[40,40,6],[105,22,6],[18,75,6],[90,62,9],[140,50,7],[198,48,7],[175,72,5],[60,95,14],[140,102,11],[92,113,7],[40,124,6],[165,124,6],[195,103,5]];
const LE = [[0,3],[1,3],[1,4],[4,6],[5,6],[6,12],[2,7],[3,7],[7,9],[7,10],[4,8],[8,11],[3,8]];
function logo(x, y, s, t) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = ORANGE; g.lineWidth = 3;
  LE.forEach(([a, b], i) => { const p = easeOut(t * 3 - i * .06); if (p <= 0) return;
    const A = LN[a], B = LN[b]; g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(A[0] + (B[0] - A[0]) * p, A[1] + (B[1] - A[1]) * p); g.stroke(); });
  g.fillStyle = ORANGE;
  LN.forEach(([nx, ny, r], i) => { const p = spring(t - i * .04, 300, 16); if (p <= 0) return;
    g.beginPath(); g.arc(nx, ny, r * p, 0, 7); g.fill(); });
  const tp = easeOut(t * 2.5 - .5);
  g.globalAlpha = tp; g.fillStyle = CREAM;
  g.font = `600 52px ${SANS}`; g.fillText('Empire', 262 + (1 - tp) * 30, 70);
  g.font = `400 40px ${SANS}`; g.letterSpacing = '2px'; g.fillText('Technologies', 262 + (1 - tp) * 30, 118); g.letterSpacing = '0px';
  g.restore(); g.globalAlpha = 1;
}

// ---------- scenes (times are VO word timestamps) ----------
const SCENES = [
  { from: 0, to: 5.4, bg: false, draw(t) {          // over the talking head: hook card at the bottom
      const a = fadeOut(t, 5.0) * easeOut(t * 4);
      g.globalAlpha = a;
      const y0 = 1430; g.fillStyle = 'rgba(10,9,8,0.88)';
      g.beginPath(); g.roundRect(X - 30, y0, RW + 60, 300, 18); g.fill();
      g.strokeStyle = RULE; g.lineWidth = 2; g.stroke();
      mono('Dev terms', X, y0 + 62, t - .1, { col: GREY, size: 28 });
      mono('CRUD', X + RW - 110, y0 + 62, t - .1, { col: ORANGE, size: 28 });
      g.fillStyle = RULE; g.fillRect(X, y0 + 90, RW, 2);
      head('Sounds bad.', X, y0 + 190, t - .3, { size: 84 });
      if (t > 2.76) {                                 // strike through on "very good"
        const p = easeOut((t - 2.76) * 4); g.fillStyle = ORANGE;
        g.font = `600 84px ${SANS}`; g.fillRect(X, y0 + 160, g.measureText('Sounds bad.').width * p, 7);
      }
      if (t > 4.1) head('Built well.', X, y0 + 268, t - 4.1, { size: 64, col: ORANGE });
      g.globalAlpha = 1;
  }},
  { from: 5.0, to: 8.0, draw(t, T) {                // C-R-U-D stands for
      mono('C-R-U-D stands for', X, 400, T - 5.42);
      rule(450, T - 5.5);
      const rows = [['C', 'Create.', 6.40], ['R', 'Read.', 6.60], ['U', 'Update.', 7.12], ['D', 'Delete.', 7.68]];
      rows.forEach(([L, word, at], i) => {
        const y = 600 + i * 170, s = spring(T - 5.42 - i * .1, 320, 18);
        g.save(); g.translate(X + 50, y - 40); g.scale(s, s);
        g.strokeStyle = ORANGE; g.lineWidth = 4; g.beginPath(); g.roundRect(-50, -50, 100, 100, 14); g.stroke();
        g.fillStyle = ORANGE; g.font = `500 64px ${MONO}`; g.textAlign = 'center'; g.fillText(L, 0, 22); g.restore();
        g.textAlign = 'left';
        head(word, X + 160, y, T - at, { size: 110 });
        g.fillStyle = RULE; g.fillRect(X, y + 50, RW * easeOut((T - at) * 3), 2);
      });
  }},
  { from: 8.0, to: 10.45, draw(t, T) {              // a methodology for REST APIs
      mono('A methodology for', X, 400, T - 8.04);
      rule(450, T - 8.2);
      head('Building', X, 600, T - 8.62, { size: 150 });
      head('a REST API.', X, 760, T - 9.72, { size: 150, col: ORANGE });
      g.fillStyle = RULE; g.fillRect(X, 830, RW * easeOut((T - 9.9) * 3), 2);
      mono('Endpoint', X, 900, T - 9.95, { size: 26 });
      typed('/api', X, 980, T - 10.0, { font: MONO, size: 56, cps: 14 });
  }},
  { from: 10.45, to: 15.0, draw(t, T) {             // for any endpoint, e.g. users
      mono('For any endpoint', X, 400, T - 10.76);
      rule(450, T - 10.9);
      head("Let's say", X, 590, T - 12.3, { size: 120 });
      head('Users.', X, 730, T - 14.3, { size: 150, col: ORANGE });
      const y0 = 850, a = easeOut((T - 11.5) * 3);       // endpoint card, like the policy card in the reference
      g.globalAlpha = a; g.strokeStyle = RULE; g.lineWidth = 2;
      g.beginPath(); g.roundRect(X, y0 + (1 - a) * 30, RW, 240, 16); g.stroke();
      mono('Endpoint', X + 34, y0 + 60, T - 11.5, { size: 26 });
      mono('REST', X + RW - 110, y0 + 60, T - 11.5, { size: 26, col: ORANGE });
      g.fillStyle = RULE; g.fillRect(X + 34, y0 + 86, RW - 68, 2);
      typed('/api/users', X + 34, y0 + 170, T - 13.84, { font: MONO, size: 60, cps: 22 });
      g.globalAlpha = 1;
  }},
  { from: 15.0, to: 19.8, draw(t, T) {              // four actions on one endpoint
      mono('One endpoint · four actions', X, 400, T - 15.02);
      rule(450, T - 15.1);
      const rows = [['POST', 'Create user.', 15.38], ['GET', 'Read user.', 16.62], ['PUT', 'Update user.', 17.58], ['DELETE', 'Delete user.', 18.38]];
      rows.forEach(([verb, label, at], i) => {
        const y = 560 + i * 150, a = easeOut((T - at) * 4);
        g.globalAlpha = a;
        g.font = `500 30px ${MONO}`; g.letterSpacing = '4px'; g.fillStyle = ORANGE; g.fillText(verb, X, y - 62); g.letterSpacing = '0px';
        g.globalAlpha = 1;
        head(label, X, y + 24, T - at, { size: 76, w: 600 });
        check(X + RW - 36, y, 30, T - at - .25);
        g.fillStyle = RULE; g.fillRect(X, y + 58, RW * a, 2);
      });
      mono('Every action you can take', X, 1200, T - 19.0, { col: ORANGE, size: 28 });
  }},
  { from: 19.8, to: 22.5, draw(t, T) {              // end card
      const a = 1 - clamp((T - 22.1) / 0.4);
      g.globalAlpha = a;
      mono('Create · Read · Update · Delete', X, 400, T - 19.85);
      rule(450, T - 19.9);
      head('Built', X, 640, T - 20.0, { size: 190 });
      head('properly.', X, 830, T - 20.15, { size: 190, col: ORANGE });
      logo(X, 1000, 1.0, T - 20.5);
      g.globalAlpha = 1;
  }},
];

function draw(T) {
  g.clearRect(0, 0, W, H);
  // dark panel wipes up over the talking head at 4.9–5.35s, stays opaque after
  const wipe = easeInOut((T - 4.9) / 0.45);
  if (wipe > 0) { g.fillStyle = BG; g.fillRect(0, H * (1 - wipe), W, H * wipe); constellation(T, wipe); }
  for (const s of SCENES) if (T >= s.from && T < s.to) {
    if (s.from > 0 && T < s.from + 0.0001) continue;
    // hard-cut feel: content of the outgoing scene fades in its last 0.2s
    g.globalAlpha = s.from === 0 ? 1 : 1 - clamp((T - s.to + 0.2) / 0.2);
    s.draw(T - s.from, T); g.globalAlpha = 1;
  }
}
window.seek = (t) => { draw(t); return true; };
window.ready = document.fonts.ready.then(() => document.fonts.load(`600 40px "DM Sans"`)).then(() => document.fonts.load(`500 40px "JetBrains Mono"`));
if (!navigator.webdriver) { window.ready.then(() => { const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }); }
</script>
</body></html>
