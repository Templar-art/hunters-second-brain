<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bespoke — SOLD pop-ups</title>
<style>
  @font-face { font-family:"Zodiak"; src:url("assets/Zodiak-Light.woff2") format("woff2"); font-weight:300; font-style:normal; font-display:block; }
  @font-face { font-family:"Zodiak"; src:url("assets/Zodiak-LightItalic.otf") format("opentype"); font-weight:300; font-style:italic; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-Medium.ttf") format("truetype"); font-weight:500; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-SemiBold.ttf") format("truetype"); font-weight:600; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-Bold.ttf") format("truetype"); font-weight:700; font-display:block; }

  :root{
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 6px 34px rgba(0,0,0,.42), 0 1px 3px rgba(0,0,0,.30);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#0a0a0a; font-family:"Poppins",system-ui,sans-serif; }

  /* ---------- stage ----------
     Absolutely centred and scaled from its own centre, so the frame is ALWAYS fully
     on screen no matter the window size. Type is sized in em off #stage's font-size,
     so 9:16 and 16:9 share one set of rules.                                        */
  #stage{
    position:fixed; left:50%; top:50%; overflow:hidden;
    transform:translate(-50%,-50%) scale(var(--fit,1));
  }
  #stage.ar-916{ width:1080px; height:1920px; font-size:100px; }
  #stage.ar-169{ width:1920px; height:1080px; font-size:74px; }

  #stage.bg-none { background:none; }                 /* alpha render — nothing behind the type */
  #stage.bg-black{ background-color:#000; }
  #stage.bg-green{ background-color:#132a24; }        /* Bespoke green */
  #stage.bg-key{   background-color:#00b140; }        /* chroma key */
  #stage.bg-plate.ar-916{ background:#1a1714 url("assets/plate.jpg")     center/cover no-repeat; }
  #stage.bg-plate.ar-169{ background:#1a1714 url("assets/plate-169.jpg") center/cover no-repeat; }
  #stage.bg-checker{
    background-color:#2b2b2b;
    background-image:
      linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%),
      linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%);
    background-size:64px 64px; background-position:0 0,32px 32px;
  }

  /* ---------- shared: no panels, white type straight on the footage ---------- */
  .pop{
    position:absolute; left:0; right:0; text-align:center;
    color:#fff; text-shadow:var(--shadow);
    visibility:hidden; pointer-events:none;
  }
  .pop.live{ visibility:visible; }
  .pop.at-title { top:17%; }
  .pop.at-logo  { top:33%; }
  .pop.at-centre{ top:50%; transform:translateY(-50%); }

  .el{ opacity:0; }
  .live .el{ animation:popIn .74s var(--ease) both; animation-delay:var(--d,0s); }
  @keyframes popIn{
    from{ opacity:0; transform:translateY(.30em) scale(.965); filter:blur(9px); }
    to  { opacity:1; transform:none;                          filter:blur(0); }
  }
  .out .el{ animation:popOut .46s cubic-bezier(.4,0,.7,.2) both; animation-delay:var(--o,0s); }
  @keyframes popOut{
    from{ opacity:1; transform:none;              filter:blur(0); }
    to  { opacity:0; transform:translateY(-.18em); filter:blur(8px); }
  }

  .num{ font-weight:700; line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .label{ font-weight:700; text-transform:uppercase; letter-spacing:.02em; line-height:1; }

  /* ---------- scene 1 — Sold / for / price ---------- */
  #s1 .sold { font-family:"Zodiak",Georgia,serif; font-weight:300; font-style:italic;
              font-size:2.80em; line-height:.86; }
  #s1 .for  { margin-top:.06em; font-size:.58em; font-weight:500; letter-spacing:.34em;
              text-transform:uppercase; }
  #s1 .price{ margin-top:.12em; font-size:1.38em; }

  /* ---------- scene 2 — logo ---------- */
  #s2 img  { width:6.6em; height:auto; margin:0 auto; display:block;
             filter:drop-shadow(0 3px 10px rgba(0,0,0,.55)) drop-shadow(0 10px 40px rgba(0,0,0,.40)); }

  /* ---------- scene 3 — three stats side by side ---------- */
  /* equal thirds — with labels this different in length, auto widths read lopsided */
  #s3 .stats{ display:grid; grid-template-columns:repeat(3,1fr); align-items:start;
              width:88%; margin:0 auto; }
  /* 88% of a 1920 frame flings them apart — keep the group tight in landscape */
  #stage.ar-169 #s3 .stats{ width:56%; }
  #s3 .num  { font-size:1.05em; }
  #s3 .label{ margin-top:.18em; font-size:.30em; letter-spacing:.10em; }

  /* ---------- controls (C hides them) ---------- */
  #ui{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:50;
    display:flex; gap:8px; align-items:center; padding:10px 14px; border-radius:999px;
    background:rgba(20,20,20,.88); border:1px solid #333; color:#ddd;
    font:500 12px/1 "Poppins",sans-serif;
  }
  #ui.hidden{ display:none; }
  #ui button{ font:500 12px/1 "Poppins",sans-serif; color:#ddd; cursor:pointer;
    background:#1e1e1e; border:1px solid #3a3a3a; border-radius:999px; padding:8px 13px; }
  #ui button:hover{ background:#2a2a2a; color:#fff; }
  #ui .sep{ width:1px; height:20px; background:#3a3a3a; margin:0 4px; }
  #ui .hint{ color:#777; }
</style>
</head>
<body>

<div id="stage" class="ar-916 bg-black">

  <!-- SCENE 1 — SOLD / $1,125,000 ————————————————— -->
  <section class="pop at-title" id="s1">
    <div class="sold el" style="--d:0s;   --o:.10s">Sold</div>
    <div class="for  el" style="--d:.30s; --o:.05s">for</div>
    <div class="price num el" style="--d:.46s; --o:0s"
         data-count="1125000" data-prefix="$" data-dur="1700">$0</div>
  </section>

  <!-- SCENE 2 — BESPOKE lockup ———————————————————— -->
  <section class="pop at-logo" id="s2">
    <img class="el" style="--d:0s; --o:0s" src="assets/bespoke-lockup.svg" alt="Bespoke Estate Agents">
  </section>

  <!-- SCENE 3 — the numbers ——————————————————————— -->
  <section class="pop at-centre" id="s3">
    <div class="stats">
      <div class="stat">
        <div class="num el"   style="--d:0s;   --o:0s" data-count="63" data-dur="1500">0</div>
        <div class="label el" style="--d:.16s; --o:0s">Enquiries</div>
      </div>
      <div class="stat">
        <div class="num el"   style="--d:.70s; --o:.04s" data-count="4" data-dur="900">0</div>
        <div class="label el" style="--d:.86s; --o:.04s">Offers</div>
      </div>
      <div class="stat">
        <div class="num el"   style="--d:1.40s; --o:.08s" data-count="26" data-dur="1100">0</div>
        <div class="label el" style="--d:1.56s; --o:.08s">Days on market</div>
      </div>
    </div>
  </section>

</div>

<div id="ui">
  <button data-act="all">▶ Play all</button>
  <div class="sep"></div>
  <button data-act="s1">1 · Sold</button>
  <button data-act="s2">2 · Logo</button>
  <button data-act="s3">3 · Numbers</button>
  <div class="sep"></div>
  <button data-act="ar">9:16</button>
  <button data-act="bg">Background</button>
  <button data-act="speed">1×</button>
  <div class="sep"></div>
  <span class="hint">C hides this</span>
</div>

<script>
const stage  = document.getElementById("stage");
const ui     = document.getElementById("ui");
const scenes = ["s1","s2","s3"].map(id => document.getElementById(id));

const TIMELINE = [
  { el: scenes[0], hold: 3600 },
  { el: scenes[1], hold: 2200 },
  { el: scenes[2], hold: 3800 }
];
const OUT = 620, GAP = 200;

let speed = 1, timers = [], raf = [];
const wait = ms => new Promise(r => timers.push(setTimeout(r, ms / speed)));

/* ---- counters: numbers roll up the way the reference reel does ---- */
const fmt = n => n.toLocaleString("en-AU");
function runCounters(scene){
  scene.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count;
    const prefix = el.dataset.prefix || "";
    const dur    = (+el.dataset.dur || 1400) / speed;
    const start  = performance.now() + (parseFloat(getComputedStyle(el).animationDelay) * 1000 || 0);
    el.textContent = prefix + "0";
    const tick = now => {
      const p = Math.min(1, Math.max(0, (now - start) / dur));
      el.textContent = prefix + fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));   // ease-out cubic
      if (p < 1) raf.push(requestAnimationFrame(tick));
    };
    raf.push(requestAnimationFrame(tick));
  });
}

/* the per-element inline style (--d / --o) as authored, so a baked render frame
   can be undone without losing the delays */
const BASE_STYLE = new WeakMap();
document.querySelectorAll(".el").forEach(el => BASE_STYLE.set(el, el.getAttribute("style") || ""));

function reset(){
  timers.forEach(clearTimeout); timers = [];
  raf.forEach(cancelAnimationFrame); raf = [];
  scenes.forEach(s => {
    s.classList.remove("live","out");
    s.querySelectorAll(".el").forEach(el => el.setAttribute("style", BASE_STYLE.get(el) || ""));
    s.querySelectorAll("[data-count]").forEach(el => el.textContent = (el.dataset.prefix||"") + "0");
  });
  void stage.offsetWidth;
}

async function playScene(t){
  t.el.classList.remove("out");
  t.el.classList.add("live");
  runCounters(t.el);
  await wait(t.hold);
  t.el.classList.add("out");
  await wait(OUT);
  t.el.classList.remove("live","out");
}

async function playOne(i){ reset(); await playScene(TIMELINE[i]); }
async function playAll(){ reset(); for (const t of TIMELINE){ await playScene(t); await wait(GAP); } }

/* ---- aspect + fit: the frame is always fully visible ---- */
const AR = { "ar-916":[1080,1920], "ar-169":[1920,1080] };
let ar = "ar-916";

function setAR(next){
  stage.classList.remove(ar); ar = next; stage.classList.add(ar);
  ui.querySelector('[data-act="ar"]').textContent = ar === "ar-916" ? "9:16" : "16:9";
  fit();
}
function fit(){
  const [w,h] = AR[ar];
  const pad = ui.classList.contains("hidden") ? 24 : 86;   // leave room for the control bar
  stage.style.setProperty("--fit", Math.min((innerWidth - 24) / w, (innerHeight - pad) / h));
}
addEventListener("resize", fit);

/* ---- controls ---- */
const BGS = ["bg-black","bg-green","bg-checker","bg-key","bg-plate","bg-none"];
let bg = 0;

ui.addEventListener("click", e => {
  const act = e.target.dataset.act;
  if (!act) return;
  if (act === "all") playAll();
  if (act === "s1")  playOne(0);
  if (act === "s2")  playOne(1);
  if (act === "s3")  playOne(2);
  if (act === "ar")  setAR(ar === "ar-916" ? "ar-169" : "ar-916");
  if (act === "bg"){ stage.classList.remove(BGS[bg]); bg = (bg + 1) % BGS.length; stage.classList.add(BGS[bg]); }
  if (act === "speed"){
    speed = speed === 1 ? 0.5 : speed === 0.5 ? 0.25 : 1;
    e.target.textContent = speed + "×";
  }
});

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "1") playOne(0);
  if (k === "2") playOne(1);
  if (k === "3") playOne(2);
  if (k === "r" || k === " ") { e.preventDefault(); playAll(); }
  if (k === "a") setAR(ar === "ar-916" ? "ar-169" : "ar-916");
  if (k === "b") ui.querySelector('[data-act="bg"]').click();
  if (k === "c"){ ui.classList.toggle("hidden"); fit(); }
});

/* ---- render mode: ?frame=<scene>:<ms>[&ar=916|169][&bg=plate|black|green|key]
   freezes one moment 1:1 for headless stills / frame sequences. ---- */
const Q = new URLSearchParams(location.search);

/* renderFrame() is also called directly over CDP to shoot a whole sequence
   from one page load — see tools/render-sequence.mjs */
window.renderFrame = async function(sceneNo, ms, opts = {}){
  const aspect = opts.ar || Q.get("ar") || "916";
  const bgName = opts.bg || Q.get("bg") || "plate";
  stage.className = `ar-${aspect} bg-${bgName}`;
  if (bgName === "none"){                       // let the page itself go transparent
    document.documentElement.style.background = "transparent";
    document.body.style.background = "transparent";
  }
  ar = "ar-" + aspect;
  ui.classList.add("hidden");
  stage.style.setProperty("--fit", 1);
  stage.style.transform = "none";
  stage.style.left = stage.style.top = "0";

  const scene = scenes[sceneNo - 1];
  reset();
  scene.classList.add("live");
  // two frames so the CSS animations exist — but never block on rAF alone:
  // a headless/backgrounded page can stop firing it entirely.
  await Promise.race([
    new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))),
    new Promise(r => setTimeout(r, 60))
  ]);
  // Freeze by baking the computed styles in and cancelling, rather than leaving paused
  // animations on the page: a page with paused animations wedges Page.captureScreenshot.
  const anims = scene.getAnimations({ subtree:true });
  anims.forEach(a => { a.currentTime = ms; });
  anims.forEach(a => { try { a.commitStyles(); } catch {} });
  anims.forEach(a => a.cancel());

  scene.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count;
    const delay  = (parseFloat(getComputedStyle(el).animationDelay) || 0) * 1000;
    const p = Math.min(1, Math.max(0, (ms - delay) / (+el.dataset.dur || 1400)));
    el.textContent = (el.dataset.prefix || "") + fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
  });
  document.body.dataset.ready = "1";
  return true;
};

if (Q.has("ar") && !Q.has("frame")) setAR("ar-" + Q.get("ar"));
fit();

if (Q.has("frame")){
  const [sceneNo, ms] = Q.get("frame").split(":").map(Number);
  document.fonts.ready.then(() => renderFrame(sceneNo, ms));
} else {
  document.fonts.ready.then(playAll);
}
</script>
</body>
</html>
