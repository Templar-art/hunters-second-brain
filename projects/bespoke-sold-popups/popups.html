<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bespoke — SOLD pop-ups (9:16)</title>
<style>
  @font-face { font-family:"Zodiak"; src:url("assets/Zodiak-Light.woff2") format("woff2"); font-weight:300; font-display:block; }
  @font-face { font-family:"Zodiak"; src:url("assets/Zodiak-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-Regular.ttf") format("truetype"); font-weight:400; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-Medium.ttf") format("truetype"); font-weight:500; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-SemiBold.ttf") format("truetype"); font-weight:600; font-display:block; }

  :root{
    --be-green:#132a24;
    --be-off-white:#F0EDE8;
    --be-grey-300:#C8C2BB;
    --ease:cubic-bezier(.16,1,.3,1);
    --pad:96px;            /* IG safe margin */
    --hair:rgba(240,237,232,.34);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#0a0a0a; font-family:"Poppins",system-ui,sans-serif; }
  body{ display:grid; place-items:center; overflow:hidden; }

  /* ---------- stage: true 1080x1920, scaled to fit ---------- */
  #stage{
    position:relative; width:1080px; height:1920px; flex:none;
    transform-origin:center center; overflow:hidden;
  }
  #stage.bg-black{ background:#000; }
  #stage.bg-green{ background:var(--be-green); }
  #stage.bg-key{ background:#00b140; }
  #stage.bg-plate{ background:#1a1714 url("assets/plate.jpg") center/cover no-repeat; }
  #stage.bg-checker{
    background-color:#2b2b2b;
    background-image:
      linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%),
      linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%);
    background-size:64px 64px; background-position:0 0,32px 32px;
  }

  /* ---------- shared pop-up shell ---------- */
  .pop{
    position:absolute; left:var(--pad); right:var(--pad);
    opacity:0; visibility:hidden; pointer-events:none;
  }
  .pop.at-lower{ bottom:300px; }
  .pop.at-centre{ top:50%; transform:translateY(-50%); }
  .pop.live{ visibility:visible; }

  .card{
    position:relative; padding:72px 72px 76px;
    background:rgba(19,42,36,.58);
    -webkit-backdrop-filter:blur(26px) saturate(115%);
    backdrop-filter:blur(26px) saturate(115%);
    border:1px solid rgba(240,237,232,.20);
    border-radius:8px;
    box-shadow:0 32px 90px rgba(0,0,0,.42);
    overflow:hidden;
  }
  /* card itself: rises + un-blurs */
  .live .card{ animation:cardIn .9s var(--ease) both; }
  .out .card{  animation:cardOut .52s cubic-bezier(.4,0,.7,.2) both; }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(56px) scale(.985); filter:blur(14px); }
    to  { opacity:1; transform:none;                        filter:blur(0); }
  }
  @keyframes cardOut{
    from{ opacity:1; transform:none;               filter:blur(0); }
    to  { opacity:0; transform:translateY(-26px);  filter:blur(10px); }
  }
  .pop.live{ opacity:1; }

  /* hairline that wipes left → right */
  .rule{ height:1px; background:var(--hair); transform:scaleX(0); transform-origin:left center; }
  .live .rule{ animation:wipe .8s var(--ease) both; animation-delay:.30s; }
  @keyframes wipe{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

  .eyebrow{
    font-weight:500; font-size:30px; letter-spacing:.38em; text-transform:uppercase;
    color:rgba(240,237,232,.72);
  }
  .label{
    font-weight:500; font-size:26px; letter-spacing:.26em; text-transform:uppercase;
    color:rgba(240,237,232,.66);
  }
  .num{
    font-family:"Zodiak",Georgia,serif; font-weight:300; color:var(--be-off-white);
    letter-spacing:-.015em; line-height:1; white-space:nowrap;
  }

  /* per-character rise, staggered by --i */
  .ch{ display:inline-block; white-space:pre; }
  .live .ch{ animation:chIn .78s var(--ease) both; animation-delay:calc(.40s + var(--i) * .045s); }
  @keyframes chIn{
    from{ opacity:0; transform:translateY(42px); filter:blur(12px); }
    to  { opacity:1; transform:none;             filter:blur(0); }
  }

  .fade{ opacity:0; }
  .live .fade{ animation:fadeUp .8s var(--ease) both; animation-delay:var(--d,.5s); }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }

  /* ---------- scene 1 — SOLD / price ---------- */
  #s1 .rule{ margin:34px 0 30px; }
  #s1 .num{ font-size:122px; }
  #s1 .addr{ margin-top:26px; font-size:28px; font-weight:400; letter-spacing:.06em; color:rgba(240,237,232,.62); }

  /* ---------- scene 2 — logo ---------- */
  #s2 .card{ padding:96px 72px 92px; text-align:center; }
  #s2 .lockup{ position:relative; display:inline-block; }
  #s2 .lockup img{ display:block; width:640px; height:auto; }
  /* wipe reveal: clip travels left → right */
  #s2.live #s2mask{ animation:reveal 1.15s var(--ease) both; animation-delay:.28s; }
  @keyframes reveal{
    from{ clip-path:inset(0 100% 0 0); } to{ clip-path:inset(0 0 0 0); }
  }
  #s2 .tag{ margin-top:36px; font-size:24px; font-weight:500; letter-spacing:.34em;
            text-transform:uppercase; color:rgba(240,237,232,.60); }
  #s2 .rule{ width:200px; margin:46px auto 0; transform-origin:center; animation-delay:.95s; }

  /* ---------- scene 3 — stats ---------- */
  #s3 .card{ padding:64px 72px 68px; }
  #s3 .row{
    display:flex; align-items:baseline; gap:36px; padding:34px 0;
    opacity:0;
  }
  #s3.live .row{ animation:rowIn .82s var(--ease) both; animation-delay:calc(.34s + var(--i) * .17s); }
  @keyframes rowIn{
    from{ opacity:0; transform:translateY(38px); filter:blur(11px); }
    to  { opacity:1; transform:none;             filter:blur(0); }
  }
  #s3 .row + .row{ border-top:1px solid rgba(240,237,232,.16); }
  #s3 .num{ font-size:104px; min-width:170px; }
  #s3 .label{ padding-bottom:14px; }
  #s3 .eyebrow{ margin-bottom:6px; }
  #s3 .rule{ margin-top:22px; }

  /* ---------- controls (hide with C for a clean record) ---------- */
  #ui{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; gap:8px; align-items:center; z-index:50;
    padding:10px 14px; border-radius:999px;
    background:rgba(20,20,20,.86); border:1px solid #333;
    font:500 12px/1 "Poppins",sans-serif; color:#ddd;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  #ui.hidden{ display:none; }
  #ui button{
    font:500 12px/1 "Poppins",sans-serif; color:#ddd; cursor:pointer;
    background:#1e1e1e; border:1px solid #3a3a3a; border-radius:999px; padding:8px 13px;
  }
  #ui button:hover{ background:#2a2a2a; color:#fff; }
  #ui .sep{ width:1px; height:20px; background:#3a3a3a; margin:0 4px; }
  #ui .hint{ color:#777; }
</style>
</head>
<body>

<div id="stage" class="bg-black">

  <!-- SCENE 1 ————————————————————————————— -->
  <section class="pop at-lower" id="s1">
    <div class="card">
      <div class="eyebrow" data-split>SOLD</div>
      <div class="rule"></div>
      <div class="num" data-split data-stagger-from="6">$1,125,000</div>
      <div class="addr fade" style="--d:1.15s">Bespoke Estate Agents</div>
    </div>
  </section>

  <!-- SCENE 2 ————————————————————————————— -->
  <section class="pop at-lower" id="s2">
    <div class="card">
      <div class="lockup">
        <div id="s2mask"><img src="assets/bespoke-lockup.svg" alt="Bespoke Estate Agents"></div>
      </div>
      <div class="rule"></div>
      <div class="tag fade" style="--d:1.15s">Beyond Luxury Real Estate</div>
    </div>
  </section>

  <!-- SCENE 3 ————————————————————————————— -->
  <section class="pop at-lower" id="s3">
    <div class="card">
      <div class="eyebrow fade" style="--d:.22s">The result</div>
      <div class="rule"></div>
      <div class="row" style="--i:0"><span class="num">63</span><span class="label">Enquiries</span></div>
      <div class="row" style="--i:1"><span class="num">4</span><span class="label">Offers</span></div>
      <div class="row" style="--i:2"><span class="num">26</span><span class="label">Days on market</span></div>
    </div>
  </section>

</div>

<div id="ui">
  <button data-act="all">▶ Play all</button>
  <div class="sep"></div>
  <button data-act="s1">1 · Sold</button>
  <button data-act="s2">2 · Logo</button>
  <button data-act="s3">3 · Stats</button>
  <div class="sep"></div>
  <button data-act="bg">Background</button>
  <button data-act="speed">1×</button>
  <div class="sep"></div>
  <span class="hint">C hides this</span>
</div>

<script>
/* ---- split text into per-char spans so each letter can rise on its own ---- */
document.querySelectorAll("[data-split]").forEach(el => {
  const from = +(el.dataset.staggerFrom || 0);
  el.innerHTML = [...el.textContent].map((c,i) =>
    `<span class="ch" style="--i:${i + from}">${c === " " ? "&nbsp;" : c}</span>`).join("");
});

const stage  = document.getElementById("stage");
const scenes = ["s1","s2","s3"].map(id => document.getElementById(id));

/* scene timing, in ms at 1× — in / hold / out */
const TIMELINE = [
  { el: scenes[0], hold: 3000 },
  { el: scenes[1], hold: 2600 },
  { el: scenes[2], hold: 3800 }
];
const OUT = 520, GAP = 180;

let speed = 1, timers = [];
const wait = ms => new Promise(r => timers.push(setTimeout(r, ms / speed)));

function reset(){
  timers.forEach(clearTimeout); timers = [];
  scenes.forEach(s => s.classList.remove("live","out"));
  void stage.offsetWidth;                 // force reflow so animations re-fire
}

async function playScene(t){
  t.el.classList.remove("out");
  t.el.classList.add("live");
  await wait(t.hold);
  t.el.classList.add("out");
  await wait(OUT);
  t.el.classList.remove("live","out");
}

async function playOne(i){ reset(); await playScene(TIMELINE[i]); }

async function playAll(){
  reset();
  for (const t of TIMELINE){ await playScene(t); await wait(GAP); }
}

/* ---- controls ---- */
const BGS = ["bg-black","bg-green","bg-checker","bg-key","bg-plate"];
let bg = 0;
const ui = document.getElementById("ui");

ui.addEventListener("click", e => {
  const act = e.target.dataset.act;
  if (!act) return;
  if (act === "all") playAll();
  if (act === "s1")  playOne(0);
  if (act === "s2")  playOne(1);
  if (act === "s3")  playOne(2);
  if (act === "bg"){ stage.classList.remove(BGS[bg]); bg = (bg + 1) % BGS.length; stage.classList.add(BGS[bg]); }
  if (act === "speed"){
    speed = speed === 1 ? 0.5 : speed === 0.5 ? 0.25 : 1;
    e.target.textContent = speed + "×";
  }
});

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "1") playOne(0);
  if (k === "2") playOne(1);
  if (k === "3") playOne(2);
  if (k === "r" || k === " ") { e.preventDefault(); playAll(); }
  if (k === "c") ui.classList.toggle("hidden");
  if (k === "b") ui.querySelector('[data-act="bg"]').click();
});

/* ---- fit the 1080×1920 stage to the window ---- */
function fit(){
  const s = Math.min(innerWidth / 1080, (innerHeight - 70) / 1920);
  stage.style.transform = `scale(${s})`;
}
addEventListener("resize", fit); fit();

document.fonts.ready.then(playAll);
</script>
</body>
</html>
