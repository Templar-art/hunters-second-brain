<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bespoke — SOLD pop-ups (9:16)</title>
<style>
  @font-face { font-family:"Zodiak"; src:url("assets/Zodiak-Light.woff2") format("woff2"); font-weight:300; font-style:normal; font-display:block; }
  @font-face { font-family:"Zodiak"; src:url("assets/Zodiak-LightItalic.otf") format("opentype"); font-weight:300; font-style:italic; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-Medium.ttf") format("truetype"); font-weight:500; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-SemiBold.ttf") format("truetype"); font-weight:600; font-display:block; }
  @font-face { font-family:"Poppins"; src:url("assets/Poppins-Bold.ttf") format("truetype"); font-weight:700; font-display:block; }

  :root{
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 6px 34px rgba(0,0,0,.42), 0 1px 3px rgba(0,0,0,.30);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#0a0a0a; font-family:"Poppins",system-ui,sans-serif; }
  body{ display:grid; place-items:center; overflow:hidden; }

  /* ---------- stage: true 1080x1920, scaled to fit ---------- */
  #stage{ position:relative; width:1080px; height:1920px; overflow:hidden; transform-origin:center; }
  #stage.bg-black{ background:#000; }
  #stage.bg-green{ background:#132a24; }        /* Bespoke green */
  #stage.bg-key{   background:#00b140; }        /* chroma key */
  #stage.bg-plate{ background:#1a1714 url("assets/plate.jpg") center/cover no-repeat; }
  #stage.bg-checker{
    background-color:#2b2b2b;
    background-image:
      linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%),
      linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%);
    background-size:64px 64px; background-position:0 0,32px 32px;
  }

  /* ---------- shared: no panels, white type straight on the footage ---------- */
  .pop{
    position:absolute; left:0; right:0; text-align:center;
    color:#fff; text-shadow:var(--shadow);
    visibility:hidden; pointer-events:none;
  }
  .pop.live{ visibility:visible; }
  .pop.at-title{ top:330px; }
  .pop.at-centre{ top:50%; transform:translateY(-50%); }

  /* every animated element: hidden until its scene is live */
  .el{ opacity:0; }
  .live .el{ animation:popIn .74s var(--ease) both; animation-delay:var(--d,0s); }
  @keyframes popIn{
    from{ opacity:0; transform:translateY(30px) scale(.965); filter:blur(9px); }
    to  { opacity:1; transform:none;                         filter:blur(0); }
  }
  .out .el{ animation:popOut .46s cubic-bezier(.4,0,.7,.2) both; animation-delay:calc(var(--o,0s)); }
  @keyframes popOut{
    from{ opacity:1; transform:none;             filter:blur(0); }
    to  { opacity:0; transform:translateY(-18px); filter:blur(8px); }
  }

  .num{ font-weight:700; line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .plus{ font-weight:700; font-size:.46em; vertical-align:.42em; margin-left:.10em; }
  .label{ font-weight:700; text-transform:uppercase; letter-spacing:.02em; line-height:1; }

  /* ---------- scene 1 — Sold / for / price ---------- */
  #s1 .sold{ font-family:"Zodiak",Georgia,serif; font-weight:300; font-style:italic;
             font-size:280px; line-height:.86; }
  #s1 .for{ margin-top:6px; font-size:58px; font-weight:500; letter-spacing:.34em;
            text-transform:uppercase; }
  #s1 .price{ margin-top:12px; font-size:138px; }

  /* ---------- scene 2 — logo ---------- */
  #s2{ top:640px; }
  #s2 img{ width:660px; height:auto; margin:0 auto; display:block;
           filter:drop-shadow(0 3px 10px rgba(0,0,0,.55)) drop-shadow(0 10px 40px rgba(0,0,0,.40)); }
  #s2 .tag{ margin-top:70px; font-size:36px; font-weight:500; letter-spacing:.36em;
            text-transform:uppercase; }

  /* ---------- scene 3 — accumulating stat stack ---------- */
  #s3 .stat + .stat{ margin-top:86px; }
  #s3 .num{ font-size:112px; }
  #s3 .label{ margin-top:16px; font-size:54px; }
  #s3 .kicker{ margin-top:96px; font-size:54px; font-weight:700; letter-spacing:.02em;
               text-transform:uppercase; }

  /* ---------- controls (C hides them) ---------- */
  #ui{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:50;
    display:flex; gap:8px; align-items:center; padding:10px 14px; border-radius:999px;
    background:rgba(20,20,20,.88); border:1px solid #333; color:#ddd;
    font:500 12px/1 "Poppins",sans-serif;
  }
  #ui.hidden{ display:none; }
  #ui button{ font:500 12px/1 "Poppins",sans-serif; color:#ddd; cursor:pointer;
    background:#1e1e1e; border:1px solid #3a3a3a; border-radius:999px; padding:8px 13px; }
  #ui button:hover{ background:#2a2a2a; color:#fff; }
  #ui .sep{ width:1px; height:20px; background:#3a3a3a; margin:0 4px; }
  #ui .hint{ color:#777; }
</style>
</head>
<body>

<div id="stage" class="bg-black">

  <!-- SCENE 1 — SOLD / $1,125,000 ————————————————— -->
  <section class="pop at-title" id="s1">
    <div class="sold el" style="--d:0s;   --o:.10s">Sold</div>
    <div class="for  el" style="--d:.30s; --o:.05s">for</div>
    <div class="price num el" style="--d:.46s; --o:0s"
         data-count="1125000" data-prefix="$" data-dur="1700">$0</div>
  </section>

  <!-- SCENE 2 — BESPOKE lockup ———————————————————— -->
  <section class="pop" id="s2">
    <img class="el" style="--d:0s" src="assets/bespoke-lockup.svg" alt="Bespoke Estate Agents">
    <div class="tag el" style="--d:.62s; --o:.04s">Beyond Luxury Real Estate</div>
  </section>

  <!-- SCENE 3 — the numbers ——————————————————————— -->
  <section class="pop at-centre" id="s3">
    <div class="stat">
      <div class="num el" style="--d:0s; --o:0s" data-count="63" data-dur="1500">0</div>
      <div class="label el" style="--d:.16s; --o:0s">Enquiries</div>
    </div>
    <div class="stat">
      <div class="num el" style="--d:1.05s; --o:.04s" data-count="4" data-dur="900">0</div>
      <div class="label el" style="--d:1.20s; --o:.04s">Offers</div>
    </div>
    <div class="stat">
      <div class="num el" style="--d:2.05s; --o:.08s" data-count="26" data-dur="1100">0</div>
      <div class="label el" style="--d:2.20s; --o:.08s">Days on market</div>
    </div>
    <div class="kicker el" style="--d:3.10s; --o:.12s">Premium marketing, proven</div>
  </section>

</div>

<div id="ui">
  <button data-act="all">▶ Play all</button>
  <div class="sep"></div>
  <button data-act="s1">1 · Sold</button>
  <button data-act="s2">2 · Logo</button>
  <button data-act="s3">3 · Numbers</button>
  <div class="sep"></div>
  <button data-act="bg">Background</button>
  <button data-act="speed">1×</button>
  <div class="sep"></div>
  <span class="hint">C hides this</span>
</div>

<script>
const stage  = document.getElementById("stage");
const scenes = ["s1","s2","s3"].map(id => document.getElementById(id));

/* in-duration (longest child delay + animation), hold, per scene — ms at 1x */
const TIMELINE = [
  { el: scenes[0], hold: 3600 },
  { el: scenes[1], hold: 2800 },
  { el: scenes[2], hold: 5200 }
];
const OUT = 620, GAP = 200;

let speed = 1, timers = [], raf = [];
const wait = ms => new Promise(r => timers.push(setTimeout(r, ms / speed)));

/* ---- counters: numbers roll up the way the reference reel does ---- */
const fmt = n => n.toLocaleString("en-AU");
function runCounters(scene){
  scene.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count;
    const prefix = el.dataset.prefix || "";
    const dur    = (+el.dataset.dur || 1400) / speed;
    const start  = performance.now() + (parseFloat(getComputedStyle(el).animationDelay) * 1000 || 0);
    el.textContent = prefix + "0";
    const tick = now => {
      const p = Math.min(1, Math.max(0, (now - start) / dur));
      const eased = 1 - Math.pow(1 - p, 3);                 // ease-out cubic
      el.textContent = prefix + fmt(Math.round(target * eased));
      if (p < 1) raf.push(requestAnimationFrame(tick));
    };
    raf.push(requestAnimationFrame(tick));
  });
}

function reset(){
  timers.forEach(clearTimeout); timers = [];
  raf.forEach(cancelAnimationFrame); raf = [];
  scenes.forEach(s => {
    s.classList.remove("live","out");
    s.querySelectorAll("[data-count]").forEach(el => el.textContent = (el.dataset.prefix||"") + "0");
  });
  void stage.offsetWidth;                                    // reflow so animations re-fire
}

async function playScene(t){
  t.el.classList.remove("out");
  t.el.classList.add("live");
  runCounters(t.el);
  await wait(t.hold);
  t.el.classList.add("out");
  await wait(OUT);
  t.el.classList.remove("live","out");
}

async function playOne(i){ reset(); await playScene(TIMELINE[i]); }
async function playAll(){ reset(); for (const t of TIMELINE){ await playScene(t); await wait(GAP); } }

/* ---- controls ---- */
const BGS = ["bg-black","bg-green","bg-checker","bg-key","bg-plate"];
let bg = 0;
const ui = document.getElementById("ui");

ui.addEventListener("click", e => {
  const act = e.target.dataset.act;
  if (!act) return;
  if (act === "all") playAll();
  if (act === "s1")  playOne(0);
  if (act === "s2")  playOne(1);
  if (act === "s3")  playOne(2);
  if (act === "bg"){ stage.classList.remove(BGS[bg]); bg = (bg + 1) % BGS.length; stage.classList.add(BGS[bg]); }
  if (act === "speed"){
    speed = speed === 1 ? 0.5 : speed === 0.5 ? 0.25 : 1;
    e.target.textContent = speed + "×";
  }
});

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "1") playOne(0);
  if (k === "2") playOne(1);
  if (k === "3") playOne(2);
  if (k === "r" || k === " ") { e.preventDefault(); playAll(); }
  if (k === "c") ui.classList.toggle("hidden");
  if (k === "b") ui.querySelector('[data-act="bg"]').click();
});

/* ---- fit 1080x1920 to the window ---- */
function fit(){
  stage.style.transform = `scale(${Math.min(innerWidth / 1080, (innerHeight - 70) / 1920)})`;
}
addEventListener("resize", fit); fit();

document.fonts.ready.then(playAll);
</script>
</body>
</html>
