<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
:root{--blue:#61a8d8;--ink:#0d1114;--grey:#6b737a;--line:#e3e6e9;--soft:#f3f6f8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:10pt;line-height:1.55}
.page{width:210mm;height:297mm;padding:20mm 18mm 18mm;position:relative;overflow:hidden;page-break-after:always;display:flex;flex-direction:column;gap:7mm}
.foot{position:absolute;left:18mm;right:18mm;bottom:9mm;display:flex;justify-content:space-between;font-size:7pt;color:var(--grey);letter-spacing:.14em;text-transform:uppercase}
.eyebrow{font-size:7.5pt;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
h1{font-weight:700;letter-spacing:-.02em;line-height:1}
h2{font-size:26pt;font-weight:700;letter-spacing:-.02em;line-height:1.05}
h3{font-size:15pt;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.k{font-size:7pt;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin-bottom:1.2mm}
.rule{height:1px;background:var(--line)}
/* cover */
.cover{background:var(--ink);color:#fff;padding:22mm 20mm}
.cover h1{font-size:68pt;margin:5mm 0 7mm}
.ctop{display:flex;justify-content:space-between;font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase;color:#9aa6af}
.cmid{margin:auto 0;padding-bottom:20mm}
.cbrand{font-size:10pt;letter-spacing:.3em}
.cover h1 span{color:var(--blue)}
.cover .sub{font-size:13pt;font-weight:300;max-width:120mm;color:#c9d2d9}
.cover .meta{display:flex;gap:14mm;font-size:8pt;color:#9aa6af;letter-spacing:.12em;text-transform:uppercase;border-top:1px solid #2a3238;padding-top:6mm}
.cover .meta b{display:block;color:#fff;font-weight:600;letter-spacing:.04em;text-transform:none;font-size:10pt;margin-top:1mm}
.cover svg{width:120mm;align-self:flex-end;margin-top:6mm}
/* intro */
.lead{font-size:13pt;font-weight:300;line-height:1.5;max-width:150mm}
.body p+p{margin-top:3mm}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.pillar{border-top:2px solid var(--blue);padding-top:4mm}
.pillar b{display:block;font-size:11pt;font-weight:600;margin-bottom:1mm}
.pillar span{color:var(--grey);font-size:9pt}
.big{font-size:20pt;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.big span{color:var(--blue)}
/* concept */
.concept{flex:1;display:flex;flex-direction:column;gap:3.2mm;padding-bottom:5mm}
.concept+.concept{border-top:1px solid var(--line);padding-top:6mm}
.chead{display:flex;align-items:baseline;gap:5mm}
.num{font-size:30pt;font-weight:800;color:var(--blue);line-height:1;width:16mm}
.pill{margin-left:auto;font-size:6.8pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:1.3mm 2.6mm;border-radius:10mm;border:1px solid var(--line);color:var(--grey);white-space:nowrap}
.pill.pick{background:var(--blue);border-color:var(--blue);color:#fff}
.idea{font-size:10.5pt}
.hook{background:var(--soft);border-left:3px solid var(--blue);padding:3.5mm 5mm}
.hook q{display:block;font-size:12pt;font-weight:600;margin-top:1mm;quotes:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm 8mm}
.cols p{font-size:9pt}
/* hype + scripts */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.hcard{border-top:2px solid var(--blue);padding-top:3mm;display:flex;flex-direction:column;gap:2mm}
.hcard h3{font-size:12pt}.hcard p{font-size:8.2pt;line-height:1.45}.hcard .hook{padding:2.2mm 3.5mm;font-size:8.4pt}.hcard .hook q{font-size:9.2pt}
.hcard .why{color:var(--grey);font-style:italic}
.hype{gap:4mm;padding-top:15mm}.hype .lead{font-size:10.5pt}.hype .hgrid{gap:4mm 6mm}
.script{display:flex;flex-direction:column;gap:3mm}
.script+.script{border-top:1px solid var(--line);padding-top:6mm}
.script td{font-size:10pt;padding:2.6mm 3mm}
.who{width:30mm;font-size:7.5pt!important;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
/* table */
table{width:100%;border-collapse:collapse;font-size:8.8pt}
th{text-align:left;font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);font-weight:600;padding:2.5mm 3mm;border-bottom:1.5px solid var(--ink)}
td{padding:2.6mm 3mm;border-bottom:1px solid var(--line);vertical-align:top}
.rank td:first-child{font-size:20pt;font-weight:800;color:var(--blue);width:14mm;line-height:1}
.rank td b{font-weight:600;font-size:10pt}
.plan td{padding:1.8mm 2.5mm;font-size:8.3pt}.plan{gap:4mm;padding-top:15mm;padding-bottom:20mm}.plan .hook q{font-size:10pt}.plan .hook{padding:2.5mm 4mm;font-size:8.8pt}.plan .idea{font-size:9.5pt}.plan .cols p,.plan .honest p{font-size:8.4pt}.plan li{font-size:8.4pt}.plan h2{font-size:18pt!important}.plan li{margin-bottom:.5mm}
.beats td:first-child{white-space:nowrap;color:var(--blue);font-weight:600;width:16mm}
ul{padding-left:4mm}li{margin-bottom:1mm;font-size:9pt}
.ess{font-size:6.8pt;font-weight:700;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;margin-bottom:1mm}
.honest{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;border-top:1.5px solid var(--ink);padding-top:3.5mm;margin-top:auto}
.honest p{font-size:8.6pt}
/* shoot day */
.slot{display:grid;grid-template-columns:30mm 1fr;gap:6mm;padding:3.6mm 0;border-bottom:1px solid var(--line)}
.slot .t{font-weight:600;color:var(--blue);font-size:9.5pt}
.slot b{font-weight:600;font-size:10.5pt;display:block}
.slot span{font-size:9pt;color:#333}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.box{background:var(--soft);padding:5mm}
.box b{display:block;font-weight:600;margin-bottom:1.5mm}
.box span{font-size:8.8pt}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:3mm 8mm;list-style:none;padding:0}
.checks li{display:flex;gap:3mm;font-size:9.2pt}
.checks li:before{content:"";flex:none;width:3.4mm;height:3.4mm;border:1.2px solid var(--ink);border-radius:.6mm;margin-top:1mm}
.close{margin-top:auto;background:var(--ink);color:#fff;padding:9mm 10mm}
.close h2{color:#fff}.close h2 span{color:var(--blue)}
.close p{color:#c9d2d9;margin-top:3mm;max-width:140mm}
</style></head><body>

page(`<div class="eyebrow">The big idea</div><h2>Show the side,<br>not the front.</h2>
<p class="lead">From the front almost every hat looks fine. The problems people actually talk about show up from the side: it fits around the head but sits up high, they keep pulling it down, and it looks off in the photos their mates take.</p>
<div class="body"><p>So the camera goes where the problem is. A locked side profile, the same head and the same light, and the viewer judges the difference for themselves.</p><p>Shak becomes the person who shows you what to look for in a hat. He doesn't have to sell it. He points out what he notices, says what annoys him, and is upfront about who the shape is not for.</p></div>
<div class="big">One rule runs through everything.<br><span>Proof over promises.</span> We film the result, whatever it is.</div>
<div class="rule"></div>
<div class="pillars"><div class="pillar"><b>The Hat Test</b><span>Real world use with a real outcome.</span></div><div class="pillar"><b>Built For Us</b><span>Who it's for and the decisions behind it.</span></div><div class="pillar"><b>Side by Side</b><span>Fair comparisons in the same frame.</span></div></div>
<div class="body"><div class="k">What's inside</div><p>12 concepts · the 6 we'd shoot first · a full plan for each · 6 hype ideas for drops · loose scripts for Shak · a one day shoot schedule · what we need from you</p></div>`);
